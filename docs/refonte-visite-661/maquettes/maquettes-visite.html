<title>Maquettes Visite METRA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
<style>
/* Layout : page de revue, une section par écran ; deux téléphones (avant / après) côte à côte, notes numérotées en dessous. */
:root{
  --bg:#F3F1EC; --fg:#1A1A18; --soft:#6B6B66; --line:#E2DFD7; --panel:#FBFAF7;
  --accent:#F26426; --accent-d:#D9531A; --accent-l:#FCE4D3;
  --ok:#2E7D32; --ko:#B91C1C; --warn:#B45309;
  --display:'Sora','Segoe UI',system-ui,sans-serif; --body:'Inter','Segoe UI',system-ui,sans-serif;
  /* Couleurs de l'appli, identiques dans les deux thèmes (ce sont des écrans de téléphone) */
  --a-bg:#F3F1EC; --a-ink:#1A1A18; --a-soft:#6B6B66; --a-faint:#A3A39D; --a-card:#FDFCFA; --a-line:rgba(22,21,15,.09);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171612;--fg:#F1EEE7;--soft:#A8A59B;--line:#34322B;--panel:#201F1A;--accent-l:#3A2418;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171612;--fg:#F1EEE7;--soft:#A8A59B;--line:#34322B;--panel:#201F1A;--accent-l:#3A2418;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:900px;margin:0 auto}
h1{font:800 22px/1.2 var(--display);margin:0 0 4px}
.sub{color:var(--soft);margin:0 0 16px;font-size:13px;max-width:62ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{font:600 12.5px var(--body);padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs button:disabled{opacity:.45;cursor:default}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:28px;flex-wrap:wrap;justify-content:center;align-items:flex-start}
.col{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.cap{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.cap b{color:var(--accent)}
.gain{font:600 12.5px var(--body);text-align:center;max-width:300px}
.gain strong{font:800 15px var(--display);color:var(--ok)}
.notes{margin:26px auto 0;max-width:620px;padding:0;list-style:none;display:grid;gap:10px}
.notes li{display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:13.5px;line-height:1.45}
.notes .n{width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font:700 11.5px/22px var(--display);text-align:center}
.notes b{font-weight:600}
.q{margin:26px auto 0;max-width:620px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);font-size:13.5px}
.q h2{font:700 14px var(--display);margin:0 0 6px}.q ol{margin:0;padding-left:18px;display:grid;gap:4px}

/* ---- Téléphone ---- */
.phone{width:300px;height:600px;border-radius:34px;border:7px solid #23221E;background:radial-gradient(circle at 92% 2%,rgba(242,100,38,.30),rgba(242,100,38,.08) 42%,rgba(242,100,38,0) 72%),radial-gradient(circle at -5% 46%,rgba(242,100,38,.14),rgba(242,100,38,0) 62%),var(--a-bg);position:relative;overflow:hidden;display:flex;flex-direction:column;color:var(--a-ink);font-family:var(--body);font-size:12px;box-shadow:0 14px 30px rgba(0,0,0,.18)}
.phone *{box-sizing:border-box}
.status{height:22px;flex:none;display:flex;justify-content:space-between;padding:6px 16px 0;font:600 9.5px var(--body);color:var(--a-soft)}
.chrome{flex:none;padding:0 10px}
.hdr{display:flex;align-items:center;gap:8px;padding:4px 0 8px}
.glassbtn{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85);border:1px solid var(--a-line);display:grid;place-items:center;flex:none}
.orb{width:30px;height:30px;border-radius:50%;background:var(--accent-l);display:grid;place-items:center;flex:none}
svg{display:block}
.ttl{flex:1;min-width:0}.ttl b{display:block;font:700 13.5px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{display:block;font-size:10px;color:var(--a-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{background:rgba(255,255,255,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 18px rgba(0,0,0,.09);border:1px solid var(--a-line);border-radius:16px;padding:8px 10px;display:flex;align-items:center;gap:9px;margin-bottom:8px}
.ring{width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--accent) var(--p),#E5E1D8 0);display:grid;place-items:center;flex:none;position:relative}
.ring i{position:absolute;inset:4px;border-radius:50%;background:#FBFAF7}
.ring u{position:relative;text-decoration:none;font:800 9.5px var(--display)}
.ring.sm{width:30px;height:30px}.ring.sm i{inset:3.5px}.ring.sm u{font-size:8px}
.hero .t{flex:1;min-width:0}.hero .t b{display:block;font:700 11px var(--body)}
.cnt{display:flex;gap:8px;font:700 9.5px var(--body);margin-top:2px;flex-wrap:wrap}
.sync{padding:5px 8px;border-radius:12px;background:var(--a-card);border:1px solid var(--a-line);font:600 9px var(--body)}
.refphoto{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid var(--a-line);margin-bottom:8px;font:600 10.5px var(--body)}
.rail{display:flex;gap:6px;overflow:hidden;padding-bottom:8px}
.chip{display:flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:15px;background:rgba(255,255,255,.75);border:1px solid var(--a-line);font:600 10.5px var(--body);color:var(--a-soft);white-space:nowrap;flex:none}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff;border-color:transparent;font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;background:#D6D1C6;flex:none}.dot.h{background:linear-gradient(90deg,var(--accent) 50%,#D6D1C6 50%)}.dot.f{background:#2E9D5B}.dot.w{background:#fff}
.dot.big{width:9px;height:9px}
.sep{width:1px;height:18px;background:rgba(22,21,15,.14);flex:none;align-self:center}
.body{flex:1;min-height:0;overflow:hidden;padding:2px 12px 0;position:relative}
.sec{font:700 12px var(--display);margin:8px 2px 6px;display:flex;justify-content:space-between;align-items:center}
.sec small{font:600 10px var(--body);color:var(--a-faint)}
.card{background:var(--a-card);border:1px solid var(--a-line);border-radius:18px;margin-bottom:12px;overflow:hidden;box-shadow:0 8px 18px rgba(0,0,0,.08)}
.f{padding:9px 12px 10px;border-top:1px solid var(--a-line)}.f:first-child{border-top:0}
.f label{display:flex;justify-content:space-between;align-items:center;font:600 10.5px var(--body);color:var(--a-soft);margin-bottom:5px}
.in{height:34px;border-radius:11px;background:#fff;border:1px solid rgba(22,21,15,.12);padding:0 10px;display:flex;align-items:center;font-size:11.5px;color:var(--a-ink)}
.in.ph{color:var(--a-faint)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pairs{display:grid;grid-template-columns:1fr 1fr}.pairs .f:nth-child(odd){border-right:1px solid var(--a-line)}.pairs .f{border-top:1px solid var(--a-line)}.pairs .f:nth-child(-n+2){border-top:0}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.opt{padding:6px 9px;border-radius:12px;border:1px solid rgba(22,21,15,.14);background:#fff;font:600 10px var(--body)}
.opt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.stepper{display:flex;align-items:center;gap:6px}.stepper b{width:34px;height:34px;border-radius:11px;background:var(--accent-l);color:var(--accent-d);display:grid;place-items:center;font:700 16px var(--display)}.stepper .in{flex:1;justify-content:center;font:700 14px var(--display)}
.flag{position:absolute;right:6px;top:3px;font:700 8px var(--body);color:#fff;background:var(--ko);padding:2px 5px;border-radius:6px}
.band{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.8);border:1px solid var(--a-line);border-radius:14px;padding:8px 10px;margin:4px 0 8px}
.band .lock{width:22px;height:22px;border-radius:7px;background:#EFEDE6;display:grid;place-items:center;flex:none}
.band div{min-width:0;flex:1}.band b{display:block;font:700 11px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.band span{font-size:9.5px;color:var(--a-soft)}
.bar{flex:none;padding:6px 10px 8px;background:linear-gradient(transparent,var(--a-bg) 30%)}
.bar .in2{display:flex;gap:6px;padding:5px;border-radius:20px;background:var(--a-card);border:1px solid var(--a-line);box-shadow:0 6px 14px rgba(0,0,0,.1)}
.act{flex:1;height:44px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:700 9px var(--body);color:var(--a-soft)}
.act.main{flex:1.25;background:linear-gradient(135deg,var(--accent),var(--accent-d));color:#fff}
.act.ko{color:#C23B2E}
.bar.slim .in2{padding:3px;border-radius:16px}.bar.slim .act{height:34px;flex-direction:row;gap:6px;border-radius:13px}
.nextcard{margin:2px 0 8px;font:600 10px var(--body);color:var(--a-soft);text-align:center}
.bracket{position:absolute;left:0;width:6px;background:var(--ko);opacity:.9;z-index:4}

.pop{position:absolute;left:10px;right:10px;top:98px;z-index:6;background:#FDFCFA;border:1px solid var(--a-line);border-radius:18px;padding:12px;box-shadow:0 16px 34px rgba(0,0,0,.22)}
.pop[hidden]{display:none}
.pop h4{margin:0 0 2px;font:800 13px var(--display)}.pop .l{font-size:10.5px;color:var(--a-soft);margin-bottom:9px}
.pbar{height:6px;border-radius:3px;background:#E5E1D8;margin:0 0 10px;overflow:hidden}.pbar i{display:block;height:100%;width:38%;background:linear-gradient(90deg,var(--accent),var(--accent-d))}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:10px}
.grid5 div{text-align:center;border-radius:11px;padding:6px 0 5px;background:#fff;border:1px solid var(--a-line)}
.grid5 b{display:block;font:800 15px var(--display)}.grid5 span{font:700 8.5px var(--body);color:var(--a-soft)}
.pl{display:flex;justify-content:space-between;font:600 10.5px var(--body);padding:5px 0;border-top:1px solid var(--a-line)}
.pl em{font-style:normal;color:var(--a-soft)}
.plink{margin-top:7px;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:12px;background:#FCE9E6;color:#C23B2E;font:700 10.5px var(--body)}
.badge{position:absolute;right:-3px;top:-3px;min-width:14px;height:14px;border-radius:7px;background:var(--accent);color:#fff;font:700 8px/14px var(--body);text-align:center;border:1.5px solid var(--a-bg)}
.rail .sbtn{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.85);border:1px solid var(--a-line);display:grid;place-items:center;flex:none}
.ring{cursor:pointer}
.body{overflow-y:auto;scrollbar-width:none}.body::-webkit-scrollbar{display:none}
.sech{display:flex;align-items:center;gap:6px;margin:8px 2px 6px}.sech b{flex:1;font:700 12px var(--display)}.sech small{font:700 10px var(--body);color:var(--a-faint)}.sech small.ok{color:#227A4A}
.mini{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:10px;background:var(--accent-l);color:var(--accent-d);font:700 9.5px var(--body)}
.opt.plus{border-style:dashed;color:var(--a-soft)}
.opt.chk::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2.5px;border:1.5px solid #B8B3A8;margin-right:5px;vertical-align:-1px;background:#fff}
.opt.chk.on::before{background:#fff;border-color:#fff}
.cr{display:flex;align-items:center;gap:8px;padding:0 12px;height:40px;border-top:1px solid var(--a-line)}.cr:first-child{border-top:0}
.cr span{flex:1;min-width:0;font:600 10.5px var(--body);color:var(--a-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr b{font:700 11px var(--body);color:var(--a-ink);text-align:right;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr i{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none}
.lbl2{font:700 9px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--a-faint);margin:6px 0 4px}
.mq{overflow:hidden;white-space:nowrap}.mq span{display:inline-block}
@keyframes mq{0%,18%{transform:translateX(0)}82%,100%{transform:translateX(var(--d))}}
@media (prefers-reduced-motion:no-preference){.mq.run span{animation:mq 7s ease-in-out infinite alternate}}

.banner{display:flex;align-items:center;gap:9px;padding:11px 12px;background:linear-gradient(135deg,#FFF3EA,#FDFCFA 70%)}
.banner.eau{background:linear-gradient(135deg,#E6F4F6,#FDFCFA 70%)}
.banner .o{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;flex:none;background:linear-gradient(145deg,#F6844F,#D9531A);box-shadow:0 5px 10px rgba(217,83,26,.35)}
.banner.eau .o{background:linear-gradient(145deg,#2FA6B5,#0F7C8C);box-shadow:0 5px 10px rgba(15,124,140,.35)}
.banner div.t{flex:1;min-width:0}.banner b{display:block;font:800 13.5px var(--display)}.banner span.s{font:600 10px var(--body);color:var(--a-soft)}
.banner .mini.eau{background:#D8F0F2;color:#0F7C8C}
.gh{display:flex;align-items:center;gap:6px;padding:7px 12px;background:rgba(22,21,15,.035);border-top:1px solid var(--a-line);font:700 9px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--a-soft)}
.gh svg{flex:none}
.seg{display:flex;padding:3px;border-radius:13px;background:#EFEDE6}.seg span{flex:1;text-align:center;padding:7px 2px;border-radius:10px;font:600 10px var(--body);color:var(--a-soft)}.seg span.on{background:var(--accent);color:#fff;box-shadow:0 3px 8px rgba(217,83,26,.35)}
.banner.eau + .gh, .eau-c .seg span.on{}
.cr b.pill{background:var(--accent-l);color:var(--accent-d);padding:3px 9px;border-radius:10px}
.eau-c .opt.on{background:#0F7C8C;border-color:#0F7C8C}.eau-c .seg span.on{background:#0F7C8C;box-shadow:0 3px 8px rgba(15,124,140,.35)}
.eau-c .cr b.pill{background:#D8F0F2;color:#0F7C8C}.eau-c .cr i{background:#0F7C8C}
.cr{cursor:pointer}.cr b.pill{max-width:62%}.cr .chev{flex:none;opacity:.45}
.lh{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}.lh label{margin:0;flex:1}
.ok{font:700 9.5px var(--body);padding:3px 9px;border-radius:9px;background:var(--accent);color:#fff;cursor:pointer}.eau-c .ok{background:#0F7C8C}
.hint{font:600 9px var(--body);color:var(--a-faint);margin-left:6px}
.opt,.seg span,.mini{cursor:pointer}
.stA{display:flex;gap:6px;align-items:center}.stA b{width:44px;height:40px;border-radius:12px;background:rgba(242,100,38,.12);border:1px solid rgba(242,100,38,.3);color:var(--accent-d);display:grid;place-items:center;font:800 18px var(--display);flex:none}.stA span{flex:1;height:40px;border-radius:12px;background:rgba(255,255,255,.85);border:1px solid rgba(22,21,15,.1);display:grid;place-items:center;font:800 16px var(--display)}
.ah{display:flex;align-items:center;gap:8px;margin-bottom:8px}.ah b{flex:1;font:700 11px var(--body);color:var(--accent-d);text-transform:uppercase}.ah small{font:500 10px var(--body);color:var(--a-faint)}
.addA{border:1.5px dashed var(--accent);background:var(--accent-l);color:var(--accent-d);border-radius:14px;padding:11px;text-align:center;font:600 11.5px var(--body);margin-bottom:12px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:9px 12px 11px;border-top:1px solid var(--a-line)}
.tl{min-width:0}.tlb{display:block;font:600 9.5px var(--body);color:var(--a-soft);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr{display:flex;align-items:center;gap:4px;height:44px;padding:0 4px;border-radius:13px;background:#fff;border:1px solid rgba(22,21,15,.12)}
.pm{width:28px;height:34px;border-radius:9px;background:var(--accent-l);color:var(--accent-d);display:grid;place-items:center;font:800 15px var(--display);cursor:pointer;flex:none;user-select:none}
.tv{flex:1;text-align:center;font:800 15px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}.tv small{font:700 9px var(--body);color:var(--a-soft);margin-left:2px}.tv.nil{color:var(--a-faint)}
.eau-c .pm{background:#D8F0F2;color:#0F7C8C}
.nh{display:flex;align-items:center;gap:9px;padding:10px 12px;cursor:pointer;border-top:1px solid var(--a-line)}.nh:first-child{border-top:0}
.nh .o2{width:28px;height:28px;border-radius:9px;background:var(--accent-l);display:grid;place-items:center;flex:none}
.nt{flex:1;min-width:0}.nt b{display:block;font:700 11.5px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nt span{font:600 9.5px var(--body);color:var(--a-soft);white-space:nowrap}
.more{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:rgba(22,21,15,.05);flex:none}
.menu{display:flex;gap:6px;padding:0 12px 10px}.menu span{flex:1;text-align:center;padding:7px 4px;border-radius:11px;background:#fff;border:1px solid var(--a-line);font:700 9.5px var(--body);cursor:pointer}.menu span.ko{color:#C23B2E;border-color:#F0C9C4}
.conf{margin:0 12px 10px;padding:9px 10px;border-radius:12px;background:#FCE9E6;font:600 10px var(--body);color:#8A2A20;display:flex;align-items:center;gap:6px}.conf span{padding:5px 9px;border-radius:9px;background:#fff;font-weight:700;cursor:pointer}.conf span.ko{background:#C23B2E;color:#fff}.conf em{flex:1;font-style:normal}
.co{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none}
.cpt{padding:10px 12px 11px;border-top:1px solid var(--a-line)}.cpt:first-of-type{border-top:0}
.cl1{display:flex;align-items:center;gap:9px;margin-bottom:7px}.cn{flex:1;min-width:0}.cn b{display:block;font:700 12px var(--body)}.cn .sub{font:600 9.5px var(--body);color:var(--a-soft);white-space:nowrap}.cn .sub em{font-style:normal;font-weight:700;color:#227A4A}.cn .sub.w em{color:var(--warn)}
.cl2{display:flex;align-items:center;gap:6px}.cin{flex:1;min-width:0;height:40px;border-radius:12px;border:1px solid rgba(22,21,15,.12);background:#fff;padding:0 12px;font:800 15px var(--display);font-variant-numeric:tabular-nums;color:var(--a-ink);outline:none}.cin:focus{border-color:var(--accent)}.cin.w{border-color:var(--warn);background:#FEF3E2}
.un{padding:0 9px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--accent-l);color:var(--accent-d);font:700 10.5px var(--body);flex:none}
.camb{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#fff;border:1px solid rgba(22,21,15,.12);flex:none}
.dt{margin-left:auto;font:700 9px var(--body);letter-spacing:0;text-transform:none;color:#227A4A;background:rgba(46,157,91,.12);padding:2px 7px;border-radius:8px}
.eau-c .dt{color:#0F7C8C;background:#D8F0F2}
.rap{display:inline-flex;gap:5px;align-items:center;font:500 10px var(--body);color:var(--a-soft);margin-bottom:5px}.rap b{color:var(--a-ink);font-weight:700}
.perm{display:inline-block;font:600 9.5px var(--body);color:#1D6FB8;background:rgba(29,111,184,.1);padding:2px 8px;border-radius:8px;margin-bottom:6px}

function tog(){const p=document.getElementById('pop-b');if(p)p.hidden=!p.hidden}
function mesure(){document.querySelectorAll('.mq').forEach(m=>{const t=m.firstElementChild,d=m.clientWidth-t.scrollWidth;if(d<0){m.style.setProperty('--d',d+'px');m.classList.add('run')}});
 for(const k of ['a','b']){
  const ph=document.getElementById('ph-'+k); if(!ph) continue;
  const top=document.getElementById('ch-'+k).getBoundingClientRect().bottom-ph.getBoundingClientRect().top;
  const bot=ph.querySelector('.bar').getBoundingClientRect().height;
  const H=ph.clientHeight, utile=Math.round((H-top-bot)/H*100);
  document.getElementById('g-'+k).textContent=utile;const le=document.getElementById('l-'+k);if(le){const b=ph.querySelector('.body');const hid=[...b.querySelectorAll('.card.closed')].flatMap(c=>[...c.children].slice(1));hid.forEach(x=>x.style.display='');const sh=b.scrollHeight;hid.forEach(x=>x.style.display='none');le.textContent=(sh/b.clientHeight).toFixed(1).replace('.',',')}
 }
}
function render(id){
 const v=document.getElementById('view');const D=DEF[id];CUR=id;
 const notes=NOTES[id].map((n,i)=>`<li><span class="n">${i+1}</span><div><b>${n[0]}</b><br><span style="color:var(--soft)">${n[1]}</span></div></li>`).join('');
 v.innerHTML=(id==='c'?`<div class="tabs" id="ctabs" style="justify-content:center">${CTABS.map((n,i)=>`<button role="tab" aria-selected="${i===CTAB}" data-ct="${i}">Conf. ${n}</button>`).join('')}</div>`:'')+`<div class="row">
  <div class="col"><div class="cap">Avant · <b>build 661</b></div>${avant(D.a,D.act,D.fab||'')}<div class="gain">Zone de saisie : <strong id="g-a"></strong> % de l’écran${D.full?`<br>Onglet complet : <strong id="l-a"></strong> écrans`:''}</div></div>
  <div class="col"><div class="cap">Après · <b>proposition</b></div>${apres(typeof D.b==='function'?D.b():D.b,D.act,D.pop)}<div class="gain">Zone de saisie : <strong id="g-b"></strong> % de l’écran${D.full?`<br>Onglet complet : <strong id="l-b"></strong> écrans`:''}</div></div>
 </div>
 <ol class="notes" style="padding:0">${notes}</ol>
 <div class="q"><h2>À trancher ensemble</h2><ol>${QS[id].map(q=>`<li>${q}</li>`).join('')}</ol></div>`;
 requestAnimationFrame(()=>{mesure();bindD()});if(id==='c')document.querySelectorAll('#ctabs button').forEach(b=>b.onclick=()=>{CTAB=+b.dataset.ct;CV.flt='all';CV.extra=null;CV.fi=null;render('c')});
 try{history.replaceState(null,'','#'+id)}catch(e){}
}
