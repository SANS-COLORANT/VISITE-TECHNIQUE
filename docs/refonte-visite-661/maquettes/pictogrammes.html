<title>Pictogrammes METRA</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
<style>
/* Mise en page : catalogue en grille par famille ; chaque tuile = pictogramme, nom, usage, trames concernées. Trait encre + une touche d'accent, bleu-vert pour l'eau. */
:root{
  --bg:#F3F1EC; --fg:#1A1A18; --soft:#6B6B66; --line:rgba(22,21,15,.1); --card:#FDFCFA;
  --ac:#F26426; --acf:rgba(242,100,38,.16); --orb1:#FFFFFF; --orb2:#FCE4D3; --chip:rgba(22,21,15,.06);
  --display:'Sora','Segoe UI',system-ui,sans-serif; --body:'Inter','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171612;--fg:#F1EEE7;--soft:#A8A59B;--line:rgba(241,238,231,.12);--card:#201F1A;--ac:#FF8A4F;--acf:rgba(255,138,79,.2);--orb1:#2B2923;--orb2:#3A2418;--chip:rgba(241,238,231,.08);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171612;--fg:#F1EEE7;--soft:#A8A59B;--line:rgba(241,238,231,.12);--card:#201F1A;--ac:#FF8A4F;--acf:rgba(255,138,79,.2);--orb1:#2B2923;--orb2:#3A2418;--chip:rgba(241,238,231,.08);color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding-inline:16px;padding-block:22px 56px}
.wrap{max-width:1040px;margin:0 auto}
h1{font:800 24px/1.15 var(--display);margin:0 0 6px;text-wrap:balance}
.lead{margin:0 0 16px;color:var(--soft);font-size:13.5px;max-width:64ch;line-height:1.5}
.leg{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 14px;font-size:12px;color:var(--soft)}
.leg span{display:inline-flex;align-items:center;gap:6px}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:5}
.nav a{font:600 11.5px var(--body);padding:6px 11px;border-radius:999px;background:var(--chip);color:var(--fg);text-decoration:none}
.nav a:focus-visible,.nav a:hover{outline:2px solid var(--ac);outline-offset:1px}
section{margin-top:26px;scroll-margin-top:60px}
h2{font:700 16px var(--display);margin:0 0 2px}
.sub{margin:0 0 12px;font-size:12.5px;color:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tile{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 12px 10px 10px;min-width:0}
.orb{width:62px;height:62px;border-radius:20px;flex:none;display:grid;place-items:center;background:linear-gradient(145deg,var(--orb1),var(--orb2));border:1px solid var(--line);position:relative;color:var(--fg)}
.orb svg{width:38px;height:38px;display:block}
.eau .orb{--ac:#0F7C8C;--acf:rgba(15,124,140,.16);--orb2:#D8F0F2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .eau .orb{--ac:#4CC3D3;--acf:rgba(76,195,211,.2);--orb2:#173238}}
:root[data-theme="dark"] .eau .orb{--ac:#4CC3D3;--acf:rgba(76,195,211,.2);--orb2:#173238}
.bd{position:absolute;right:-4px;top:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--ac);color:#fff;font:700 10px/18px var(--body);text-align:center;border:2px solid var(--card)}
.tx{min-width:0}.tx b{display:block;font:700 13px/1.25 var(--body)}.tx span{display:block;font-size:11.5px;line-height:1.35;color:var(--soft);margin-top:2px}
.tg{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}.tg i{font:700 9px var(--body);font-style:normal;letter-spacing:.04em;padding:2px 6px;border-radius:6px;background:var(--chip);color:var(--soft)}
.k,.a,.fa{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.a{stroke:var(--ac)}.fa{fill:var(--acf);stroke:var(--ac)}.d{fill:var(--ac);stroke:none}
</style>

<div class="wrap">
  <h1>Pictogrammes METRA</h1>
  <p class="lead">Un pictogramme dessiné pour chaque onglet, rubrique, type d'équipement, compteur et statut, trame par trame. Même grille et même trait partout : l'encre pour la forme, l'orange pour l'élément qui parle, le bleu-vert pour tout ce qui touche à l'eau.</p>
  <div class="leg"><span><svg width="18" height="18" viewBox="0 0 24 24" style="color:var(--fg)"><path class="k" d="M4 12h16"/></svg> forme</span><span><svg width="18" height="18" viewBox="0 0 24 24"><path class="a" d="M4 12h16"/></svg> accent</span><span id="cnt"></span></div>
  <nav class="nav" id="nav" aria-label="Familles"></nav>
  <div id="out"></div>
</div>
