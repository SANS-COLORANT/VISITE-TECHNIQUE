name: Repair report image assets

on:
  push:
    branches:
      - fix/pdf-report-word-layout
    paths:
      - .github/workflows/repair-report-assets.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/pdf-report-word-layout
          fetch-depth: 0

      - name: Restore last known-good report assets
        run: |
          git show 7a3d91859070810b3d1edf72c2f012b08f070f6e:reportBrandAssets.js > reportBrandAssets.js
          cp reportBrandAssets.js /tmp/reportBrandAssets.mjs
          node --check /tmp/reportBrandAssets.mjs
          rm -f assets/report/report_logo.jpg

      - name: Commit restored assets and remove one-time workflow
        run: |
          rm .github/workflows/repair-report-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore valid Word report assets for Metro"
          git push origin HEAD:fix/pdf-report-word-layout
