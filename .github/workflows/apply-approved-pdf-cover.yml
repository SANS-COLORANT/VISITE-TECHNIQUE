name: Apply approved PDF cover

on:
  push:
    branches:
      - fix/pdf-report-word-layout
    paths:
      - .github/workflows/apply-approved-pdf-cover.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/pdf-report-word-layout

      - name: Restore original Word branding assets
        run: |
          git show 1290c63ccd939aaef6e7ad618e3960cd0435d94b:reportBrandAssets.js > reportBrandAssets.js

      - name: Apply approved cover and interior branding
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('reportBuilder.js')
          source = path.read_text(encoding='utf-8')

          # The HTML cover keeps only the dynamic client banner visible. Everything
          # else on page 1 is redrawn precisely with pdf-lib using the original Word assets.
          cover_client = ".coverClient{position:absolute;left:12mm;right:12mm;top:49mm;height:20mm;background:${ORANGE};color:#fff;border-radius:5mm;text-align:center;padding:0;font-size:18pt;font-weight:700;z-index:3;display:flex;align-items:center;justify-content:center}"
          source, count = re.subn(r'\.coverClient\{[^}]*\}', lambda _: cover_client, source, count=1)
          if count != 1:
              raise SystemExit('coverClient CSS not found')

          new_function = r'''async function habillerPdf(uriSource, config, siteFooter) {
            const sourceBase64 = await FileSystem.readAsStringAsync(uriSource, { encoding: FileSystem.EncodingType.Base64 });
            const pdf = await PDFDocument.load(sourceBase64);
            const pages = pdf.getPages();
            const font = await pdf.embedFont(StandardFonts.Helvetica);
            const bold = await pdf.embedFont(StandardFonts.HelveticaBold);
            let logo = null;
            let cover = null;
            let opqibi = null;
            try { logo = await pdf.embedJpg(dataUriBase64(REPORT_LOGO)); } catch {}
            try { cover = await pdf.embedJpg(dataUriBase64(REPORT_COVER)); } catch {}
            try { opqibi = await pdf.embedJpg(dataUriBase64(REPORT_OPQIBI)); } catch {}

            const total = pages.length;
            const mm = (value) => value * 72 / 25.4;
            const white = rgb(1, 1, 1);
            const grey = rgb(0.35, 0.35, 0.35);
            const textGrey = rgb(0.42, 0.42, 0.42);
            const orange = rgb(0.94, 0.45, 0.05);

            const fit = (image, maxWidth, maxHeight) => {
              if (!image) return { width: 0, height: 0 };
              const ratio = image.width / image.height;
              let width = maxWidth;
              let height = width / ratio;
              if (height > maxHeight) {
                height = maxHeight;
                width = height * ratio;
              }
              return { width, height };
            };

            pages.forEach((page, index) => {
              const { width, height } = page.getSize();

              if (index === 0) {
                // Preserve only the dynamic orange client banner generated by HTML.
                // All other cover content is repainted exactly like the approved Word layout.
                const bannerBottom = height - mm(82);
                const bannerTop = height - mm(62);
                page.drawRectangle({ x: 0, y: 0, width, height: bannerBottom, color: white });
                page.drawRectangle({ x: 0, y: bannerTop, width, height: height - bannerTop, color: white });
                page.drawRectangle({ x: 0, y: bannerBottom, width: mm(30), height: mm(20), color: white });
                page.drawRectangle({ x: width - mm(30), y: bannerBottom, width: mm(30), height: mm(20), color: white });

                if (logo) {
                  const box = fit(logo, mm(72), mm(15));
                  page.drawImage(logo, {
                    x: mm(18),
                    y: height - mm(36) + (mm(15) - box.height) / 2,
                    width: box.width,
                    height: box.height,
                  });
                }

                const dateText = `VERSAILLES, LE ${dateFr(config.dateRapport || new Date().toISOString().slice(0, 10))}`;
                const dateSize = 9;
                page.drawText(dateText, {
                  x: width - mm(18) - bold.widthOfTextAtSize(dateText, dateSize),
                  y: height - mm(31),
                  size: dateSize,
                  font: bold,
                  color: rgb(0.25, 0.25, 0.25),
                });

                const refText = `Nos réf. : ${config.chrono || ''}`;
                page.drawText(refText, { x: mm(22), y: height - mm(52), size: 10, font: bold, color: rgb(0.15, 0.15, 0.15) });
                page.drawLine({ start: { x: mm(22), y: height - mm(53) }, end: { x: mm(55), y: height - mm(53) }, thickness: 0.5, color: rgb(0.15, 0.15, 0.15) });

                if (cover) {
                  const maxW = width - mm(54);
                  const maxH = mm(78);
                  const box = fit(cover, maxW, maxH);
                  page.drawImage(cover, {
                    x: (width - box.width) / 2,
                    y: height - mm(171) + (maxH - box.height) / 2,
                    width: box.width,
                    height: box.height,
                  });
                }

                const objectText = String(config.objet || 'Compte rendu de visite technique');
                const objectSize = 14;
                page.drawText(objectText, {
                  x: (width - bold.widthOfTextAtSize(objectText, objectSize)) / 2,
                  y: height - mm(190),
                  size: objectSize,
                  font: bold,
                  color: rgb(0.15, 0.15, 0.15),
                });

                const business = '• COPROPRIÉTÉS   • BAILLEURS SOCIAUX   • COLLECTIVITÉS   • TERTIAIRE';
                const businessSize = 6.8;
                page.drawText(business, {
                  x: (width - bold.widthOfTextAtSize(business, businessSize)) / 2,
                  y: height - mm(204),
                  size: businessSize,
                  font: bold,
                  color: rgb(0.28, 0.28, 0.28),
                });

                const cities = 'VERSAILLES     NANTES     TOURS     RENNES     LYON     BORDEAUX';
                const citiesSize = 6.6;
                page.drawText(cities, {
                  x: (width - font.widthOfTextAtSize(cities, citiesSize)) / 2,
                  y: mm(28.6),
                  size: citiesSize,
                  font,
                  color: textGrey,
                });

                const barY = mm(17.4);
                const barH = mm(8.6);
                const websiteW = mm(45);
                page.drawRectangle({ x: 0, y: barY, width: width - websiteW, height: barH, color: orange });
                page.drawRectangle({ x: width - websiteW, y: barY, width: websiteW, height: barH, color: grey });

                const contact = 'Tél. 01 39 55 17 20 - 21 avenue Georges Pompidou - 69486 LYON CEDEX 3 - contact@energieetservice.fr';
                const contactSize = 6.2;
                page.drawText(contact, {
                  x: Math.max(mm(3), ((width - websiteW) - font.widthOfTextAtSize(contact, contactSize)) / 2),
                  y: barY + mm(3.1),
                  size: contactSize,
                  font,
                  color: white,
                });

                const website = 'energieetservice.fr';
                const websiteSize = 9;
                page.drawText(website, {
                  x: width - websiteW + (websiteW - bold.widthOfTextAtSize(website, websiteSize)) / 2,
                  y: barY + mm(2.9),
                  size: websiteSize,
                  font: bold,
                  color: white,
                });

                if (opqibi) {
                  const box = fit(opqibi, mm(19), mm(7.5));
                  page.drawImage(opqibi, { x: mm(4), y: mm(5.2), width: box.width, height: box.height });
                }

                const legal = 'SAS au capital de 292 500 € - Siège social : 64 avenue de Paris - 78000 Versailles - RCS Versailles B 338 335 201 / NAF 7112B';
                page.drawText(legal, { x: mm(26), y: mm(7.5), size: 5.4, font, color: textGrey });
                return;
              }

              const left = 50;
              const footerY = 20;

              // Use the exact spiral from the original full logo: draw the real JPEG,
              // then mask its wordmark, leaving only the left pictogram visible.
              if (logo) {
                const logoH = 28;
                const ratio = logo.width / logo.height;
                const logoW = logoH * ratio;
                const logoY = height - 36;
                page.drawRectangle({ x: left - 3, y: logoY - 2, width: 36, height: logoH + 5, color: white });
                page.drawImage(logo, { x: left, y: logoY, width: logoW, height: logoH });
                page.drawRectangle({ x: left + 29, y: logoY - 1, width: Math.max(0, logoW - 27), height: logoH + 3, color: white });
              }

              const running = String(config.objet || 'Compte rendu de visite technique').toUpperCase();
              const runSize = 7.2;
              const runWidth = bold.widthOfTextAtSize(running, runSize);
              page.drawText(running, { x: Math.max(left + 90, width - 50 - runWidth), y: height - 24, size: runSize, font: bold, color: rgb(0.15, 0.15, 0.15) });

              const meta = [`Nos réf. : ${config.chrono || ''}`, `Site : ${siteFooter || ''}`, `Objet : ${config.objet || ''}`];
              meta.forEach((line, i) => page.drawText(String(line), { x: left, y: footerY + 15 - i * 7, size: 5.8, font, color: grey }));

              const pageText = `${index + 1}/${total}`;
              const arrowW = 23;
              const numW = 38;
              const boxH = 17;
              const x = width - arrowW - numW;
              page.drawRectangle({ x, y: footerY - 1, width: arrowW, height: boxH, color: grey });
              page.drawRectangle({ x: x + arrowW, y: footerY - 1, width: numW, height: boxH, color: orange });
              const arrowY = footerY + 7.5;
              page.drawLine({ start: { x: x + 6, y: arrowY }, end: { x: x + 16, y: arrowY }, thickness: 1.2, color: white });
              page.drawLine({ start: { x: x + 13, y: arrowY + 3 }, end: { x: x + 16, y: arrowY }, thickness: 1.2, color: white });
              page.drawLine({ start: { x: x + 13, y: arrowY - 3 }, end: { x: x + 16, y: arrowY }, thickness: 1.2, color: white });
              const numSize = 6.6;
              page.drawText(pageText, {
                x: x + arrowW + (numW - bold.widthOfTextAtSize(pageText, numSize)) / 2,
                y: footerY + 4.8,
                size: numSize,
                font: bold,
                color: white,
              });
            });

            const base64 = await pdf.saveAsBase64({ dataUri: false });
            const sortie = `${FileSystem.cacheDirectory}rapport-habille-${Date.now()}.pdf`;
            await FileSystem.writeAsStringAsync(sortie, base64, { encoding: FileSystem.EncodingType.Base64 });
            return sortie;
          }'''

          pattern = r'async function habillerPdf\(uriSource, config, siteFooter\) \{[\s\S]*?\n\}\n\nexport async function'
          source, count = re.subn(pattern, lambda _: new_function + '\n\nexport async function', source, count=1)
          if count != 1:
              raise SystemExit('habillerPdf function not found')

          path.write_text(source, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/apply-approved-pdf-cover.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reportBrandAssets.js reportBuilder.js .github/workflows/apply-approved-pdf-cover.yml
          git commit -m "fix: apply approved Word PDF cover and branding"
          git push origin HEAD:fix/pdf-report-word-layout
