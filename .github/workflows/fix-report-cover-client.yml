name: Fix Report Cover Client

on:
  push:
    branches:
      - tmp/report-assets-direct
    paths:
      - .github/workflows/fix-report-cover-client.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tmp/report-assets-direct
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/fix_report_cover_client.py

      - name: Validate JavaScript
        run: |
          cp reportBuilder.js /tmp/reportBuilder.mjs
          node --check /tmp/reportBuilder.mjs

      - name: Validate Android bundle
        run: |
          npm install --no-audit --no-fund
          npx expo export --platform android --output-dir dist-report-client

      - name: Commit patch
        run: |
          rm .github/workflows/fix-report-cover-client.yml
          rm .github/scripts/fix_report_cover_client.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: bind client name to PDF cover"
          git push origin HEAD:tmp/report-assets-direct
