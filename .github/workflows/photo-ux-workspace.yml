name: Photo UX workspace export
on:
  push:
    branches: [feat/photos-field-workflow]
    paths: [.github/workflows/photo-ux-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export committed source without credentials
        run: git archive --format=tar.gz -o /tmp/metra-photo-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: metra-photo-source
          path: /tmp/metra-photo-source.tar.gz
          retention-days: 1
          compression-level: 0
