name: Trigger schema39 APK build

on:
  push:
    branches:
      - fix/metra-structure-schema39
    paths:
      - '.github/workflows/trigger-schema39-apk-build.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch APK workflow on schema39 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run native-android-apk.yml -R SANS-COLORANT/VISITE-TECHNIQUE --ref "${GITHUB_REF_NAME}"
