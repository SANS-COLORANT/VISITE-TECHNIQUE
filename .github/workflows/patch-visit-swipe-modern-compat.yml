name: Temporary modern swipe pager compatibility patch

on:
  push:
    branches: [perf/visit-swipe-pager]
    paths: [.github/workflows/patch-visit-swipe-modern-compat.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/visit-swipe-pager
          fetch-depth: 0
      - name: Apply modern pager compatibility
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(s, old, new, label):
              if new in s:
                  return s
              if old not in s:
                  raise SystemExit(f'{label}: marker not found')
              return s.replace(old, new, 1)

          # -----------------------------------------------------------------
          # VisiteScreen: preserve Pré-allumage local swipes with the new
          # stable pager. In source/dev, if the build-time registration is not
          # present, the child responder remains free to handle the gesture.
          # -----------------------------------------------------------------
          p = Path('VisiteScreen.js')
          s = p.read_text(encoding='utf-8')

          s = replace_once(
              s,
              "  intranetLinked,\n}) {",
              "  intranetLinked,\n  onRegisterLocalSwipe,\n}) {",
              'panel host registration prop',
          )
          s = replace_once(
              s,
              "  return <TrameGenericPanel visiteId={visiteId} panelId={panelId} sections={sections} onSaved={onSaved} />;",
              "  return <TrameGenericPanel visiteId={visiteId} panelId={panelId} sections={sections} onSaved={onSaved} onRegisterLocalSwipe={onRegisterLocalSwipe} />;",
              'panel host forwards local swipe registration',
          )

          refs_old = """  const transitionRef = useRef(false);
  const pagerX = useRef(new Animated.Value(0)).current;
  const gestureStartIndexRef = useRef(0);
  const finishSwipeRef = useRef(null);
"""
          refs_new = """  const transitionRef = useRef(false);
  const pagerX = useRef(new Animated.Value(0)).current;
  const preAllumageLocalX = useRef(new Animated.Value(0)).current;
  const preAllumageLocalSwipeRef = useRef(null);
  const trameIdRef = useRef(DEFAULT_TRAME_ID);
  const gestureModeRef = useRef('tabs');
  const gestureStartIndexRef = useRef(0);
  const finishSwipeRef = useRef(null);
  const finishLocalSwipeRef = useRef(null);
"""
          s = replace_once(s, refs_old, refs_new, 'pager local swipe refs')

          s = replace_once(
              s,
              "  const trame = obtenirTrame(visite?.trame_id || DEFAULT_TRAME_ID);\n",
              "  const trame = obtenirTrame(visite?.trame_id || DEFAULT_TRAME_ID);\n  trameIdRef.current = trame.id;\n",
              'current trame ref',
          )

          cleanup_old = """    if (pagerPruneTimerRef.current) clearTimeout(pagerPruneTimerRef.current);
    pagerX.stopAnimation();
    invaliderCacheTrameGenerique(visiteId);
"""
          cleanup_new = """    if (pagerPruneTimerRef.current) clearTimeout(pagerPruneTimerRef.current);
    pagerX.stopAnimation();
    preAllumageLocalX.stopAnimation();
    invaliderCacheTrameGenerique(visiteId);
"""
          s = replace_once(s, cleanup_old, cleanup_new, 'local swipe cleanup')
          s = s.replace("  }, [pagerX, visiteId]);", "  }, [pagerX, preAllumageLocalX, visiteId]);", 1)

          caisson_anchor = """  const onCaissonsChange = useCallback((next) => {
    setVmcCaissons(next || []);
    invaliderCacheTrameGenerique(visiteId);
    onSaved();
  }, [visiteId, onSaved]);

"""
          local_logic = r'''  const enregistrerSwipeLocalPreAllumage = useCallback((handler) => {
    preAllumageLocalSwipeRef.current = typeof handler === 'function' ? handler : null;
  }, []);

  const terminerSwipeLocalPreAllumage = useCallback((g) => {
    const w = pagerWidthRef.current;
    const threshold = Math.max(44, w * 0.065);
    const versSuivant = g.dx < -threshold || g.vx < -0.42;
    const versPrecedent = g.dx > threshold || g.vx > 0.42;
    const direction = versSuivant ? 1 : versPrecedent ? -1 : 0;
    const peutChanger = direction ? preAllumageLocalSwipeRef.current?.(direction, false) : false;
    if (!peutChanger) {
      Animated.spring(preAllumageLocalX, { toValue: 0, speed: 28, bounciness: 0, useNativeDriver: true }).start(() => {
        transitionRef.current = false;
      });
      return;
    }
    Animated.timing(preAllumageLocalX, {
      toValue: direction > 0 ? -w : w,
      duration: 115,
      easing: Easing.out(Easing.cubic),
      useNativeDriver: true,
    }).start(({ finished }) => {
      if (!finished) { transitionRef.current = false; return; }
      const changed = preAllumageLocalSwipeRef.current?.(direction, true);
      if (!changed) {
        preAllumageLocalX.setValue(0);
        transitionRef.current = false;
        return;
      }
      preAllumageLocalX.setValue(direction > 0 ? w : -w);
      requestAnimationFrame(() => {
        Animated.timing(preAllumageLocalX, {
          toValue: 0,
          duration: 165,
          easing: Easing.out(Easing.cubic),
          useNativeDriver: true,
        }).start(() => { transitionRef.current = false; });
      });
    });
  }, [preAllumageLocalX]);
  finishLocalSwipeRef.current = terminerSwipeLocalPreAllumage;

'''
          if 'const enregistrerSwipeLocalPreAllumage = useCallback' not in s:
              if caisson_anchor not in s:
                  raise SystemExit('preallumage local logic anchor not found')
              s = s.replace(caisson_anchor, caisson_anchor + local_logic, 1)

          responder_old = """      onMoveShouldSetPanResponder: (_evt, g) => !transitionRef.current && Math.abs(g.dx) > 9 && Math.abs(g.dx) > Math.abs(g.dy) * 1.35,
      onPanResponderGrant: () => {
        Keyboard.dismiss();
        const tabs = tabOrderRef.current;
        gestureStartIndexRef.current = Math.max(0, tabs.indexOf(activeTabRef.current));
        transitionRef.current = true;
        pagerX.stopAnimation();
      },
      onPanResponderMove: (_evt, g) => {
        const tabs = tabOrderRef.current;
        const idx = Math.max(0, Math.min(tabs.length - 1, gestureStartIndexRef.current));
        const w = pagerWidthRef.current;
        let dx = g.dx;
        if ((idx === 0 && dx > 0) || (idx === tabs.length - 1 && dx < 0)) dx *= 0.24;
        const target = dx < -36 && idx < tabs.length - 1 ? tabs[idx + 1] : dx > 36 && idx > 0 ? tabs[idx - 1] : null;
        if (target && !mountedPanelIdsRef.current.has(target)) ensureMountedRef.current?.([target]);
        pagerX.setValue(-idx * w + dx);
      },
      onPanResponderRelease: (_evt, g) => finishSwipeRef.current?.(g),
      onPanResponderTerminate: () => {
        const idx = Math.max(0, gestureStartIndexRef.current);
        Animated.spring(pagerX, { toValue: -idx * pagerWidthRef.current, speed: 28, bounciness: 0, useNativeDriver: true }).start(() => {
          transitionRef.current = false;
        });
      },
"""
          responder_new = """      onMoveShouldSetPanResponder: (_evt, g) => {
        if (transitionRef.current || Math.abs(g.dx) <= 9 || Math.abs(g.dx) <= Math.abs(g.dy) * 1.35) return false;
        const localMode = trameIdRef.current === 'pre_allumage' && activeTabRef.current === 'p-pa-batiments';
        return localMode ? typeof preAllumageLocalSwipeRef.current === 'function' : true;
      },
      onPanResponderGrant: () => {
        Keyboard.dismiss();
        const localMode = trameIdRef.current === 'pre_allumage' && activeTabRef.current === 'p-pa-batiments' && typeof preAllumageLocalSwipeRef.current === 'function';
        gestureModeRef.current = localMode ? 'preallumage-local' : 'tabs';
        transitionRef.current = true;
        if (localMode) {
          preAllumageLocalX.stopAnimation();
          return;
        }
        const tabs = tabOrderRef.current;
        gestureStartIndexRef.current = Math.max(0, tabs.indexOf(activeTabRef.current));
        pagerX.stopAnimation();
      },
      onPanResponderMove: (_evt, g) => {
        if (gestureModeRef.current === 'preallumage-local') {
          const direction = g.dx < 0 ? 1 : -1;
          const peutChanger = preAllumageLocalSwipeRef.current?.(direction, false);
          preAllumageLocalX.setValue(peutChanger ? g.dx : g.dx * 0.20);
          return;
        }
        const tabs = tabOrderRef.current;
        const idx = Math.max(0, Math.min(tabs.length - 1, gestureStartIndexRef.current));
        const w = pagerWidthRef.current;
        let dx = g.dx;
        if ((idx === 0 && dx > 0) || (idx === tabs.length - 1 && dx < 0)) dx *= 0.24;
        const target = dx < -36 && idx < tabs.length - 1 ? tabs[idx + 1] : dx > 36 && idx > 0 ? tabs[idx - 1] : null;
        if (target && !mountedPanelIdsRef.current.has(target)) ensureMountedRef.current?.([target]);
        pagerX.setValue(-idx * w + dx);
      },
      onPanResponderRelease: (_evt, g) => {
        if (gestureModeRef.current === 'preallumage-local') finishLocalSwipeRef.current?.(g);
        else finishSwipeRef.current?.(g);
      },
      onPanResponderTerminate: () => {
        if (gestureModeRef.current === 'preallumage-local') {
          Animated.spring(preAllumageLocalX, { toValue: 0, speed: 28, bounciness: 0, useNativeDriver: true }).start(() => {
            transitionRef.current = false;
          });
          return;
        }
        const idx = Math.max(0, gestureStartIndexRef.current);
        Animated.spring(pagerX, { toValue: -idx * pagerWidthRef.current, speed: 28, bounciness: 0, useNativeDriver: true }).start(() => {
          transitionRef.current = false;
        });
      },
"""
          s = replace_once(s, responder_old, responder_new, 'stable pager preallumage gesture routing')

          host_old = """          <VisitPanelHost
            visiteId={visiteId}
            panelId={panelId}
            sections={panels[panelId]}
            special={specialPanels.has(panelId)}
            onSaved={onSaved}
            tabOrder={tabOrder}
            panelLabels={panelLabels}
            panels={panels}
            intranetLinked={intranetLinked}
          />
"""
          host_new = """          <Animated.View style={{ flex: 1, transform: panelId === 'p-pa-batiments' ? [{ translateX: preAllumageLocalX }] : [] }}>
            <VisitPanelHost
              visiteId={visiteId}
              panelId={panelId}
              sections={panels[panelId]}
              special={specialPanels.has(panelId)}
              onSaved={onSaved}
              tabOrder={tabOrder}
              panelLabels={panelLabels}
              panels={panels}
              intranetLinked={intranetLinked}
              onRegisterLocalSwipe={trame.id === 'pre_allumage' && panelId === 'p-pa-batiments' ? enregistrerSwipeLocalPreAllumage : undefined}
            />
          </Animated.View>
"""
          s = replace_once(s, host_old, host_new, 'preallumage local animated host')
          p.write_text(s, encoding='utf-8')

          # -----------------------------------------------------------------
          # Historical build patches: the product now contains a modern pager
          # implementation. Allow the old marker-based patches to skip only
          # their obsolete VisiteScreen replacements. All other PRE patches
          # remain strict and continue to fail if their markers drift.
          # -----------------------------------------------------------------
          compat = {
              '.github/scripts/patch_preallumage_field_ux_base.py': {
                  'disable global swipe on preallumage installations',
              },
              '.github/scripts/patch_preallumage_navigation_popup_fix.py': {
                  'reactivate robust global responder for local swipe',
                  'route swipe to preallumage local',
                  'terminerSwipe dependency',
                  'local swipe drag feedback',
                  'visit local swipe registration callback',
                  'pass local swipe registration',
              },
              '.github/scripts/patch_preallumage_swipe_performance.py': {
                  'full page local swipe transition',
                  'interactive full page local drag',
              },
          }
          old_fn = """def replace_once(text: str, old: str, new: str, label: str) -> str:
    if new in text:
        return text
    if old not in text:
        raise SystemExit(f'{label}: marker not found')
    return text.replace(old, new, 1)
"""
          for path, labels in compat.items():
              q = Path(path)
              text = q.read_text(encoding='utf-8')
              labels_literal = repr(labels)
              new_fn = f"""def replace_once(text: str, old: str, new: str, label: str) -> str:
    if new in text:
        return text
    if old not in text:
        modern_pager_labels = {labels_literal}
        if label in modern_pager_labels and 'const pagerX = useRef(new Animated.Value(0)).current' in text and 'preAllumageLocalSwipeRef' in text:
            return text
        raise SystemExit(f'{{label}}: marker not found')
    return text.replace(old, new, 1)
"""
              if 'modern_pager_labels =' not in text:
                  if old_fn not in text:
                      raise SystemExit(f'{path}: replace_once marker not found')
                  text = text.replace(old_fn, new_fn, 1)
              q.write_text(text, encoding='utf-8')

          # Extend the committed performance contract with the PRE local-route
          # safety that replaces the old build-only transition.
          q = Path('.github/scripts/check_runtime_responsiveness_v3.js')
          text = q.read_text(encoding='utf-8')
          anchor = "requireText(visit,'if (!swipeHandlers.current)','stable PanResponder allocation');\n"
          extra = anchor + "requireText(visit,\"gestureModeRef.current = localMode ? 'preallumage-local' : 'tabs'\",'preallumage local swipe separated from tab pager');\nrequireText(visit,'preAllumageLocalSwipeRef.current?.(direction, false)','preallumage local dry-run before animation');\nrequireText(visit,\"onRegisterLocalSwipe={trame.id === 'pre_allumage'\",'preallumage local handler registration');\n"
          if 'preallumage local swipe separated from tab pager' not in text:
              if anchor not in text:
                  raise SystemExit('responsiveness contract anchor not found')
              text = text.replace(anchor, extra, 1)
          q.write_text(text, encoding='utf-8')
          PY
          node --check VisiteScreen.js
          node .github/scripts/check_runtime_responsiveness_v3.js
          git diff --check
      - name: Commit compatibility update
        shell: bash
        run: |
          git config user.name "SANS-COLORANT"
          git config user.email "154561309+SANS-COLORANT@users.noreply.github.com"
          git add VisiteScreen.js .github/scripts/check_runtime_responsiveness_v3.js .github/scripts/patch_preallumage_field_ux_base.py .github/scripts/patch_preallumage_navigation_popup_fix.py .github/scripts/patch_preallumage_swipe_performance.py
          git diff --cached --quiet && exit 0
          git commit -m "perf: preserve preallumage local swipes with pager"
          git push origin HEAD:perf/visit-swipe-pager
