name: Native Android Check

on:
  push:
    branches:
      - native-android
    paths:
      - '**/*.js'
      - '**/*.json'
      - 'native/**'
      - 'plugins/**'
      - 'database/**'
      - 'assets/metra/**'
      - 'visual-packs/**'
      - '.github/workflows/native-android-check.yml'
      - '.github/scripts/**'
  pull_request:
    branches:
      - native-android
    paths:
      - '**/*.js'
      - '**/*.json'
      - 'native/**'
      - 'plugins/**'
      - 'database/**'
      - 'assets/metra/**'
      - 'visual-packs/**'
      - '.github/workflows/native-android-check.yml'
      - '.github/scripts/**'

concurrency:
  group: native-android-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        -Dorg.gradle.workers.max=2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SQLite schema version
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          constants=Path('database/constants.js').read_text(encoding='utf-8'); migrations=Path('database/migrations/index.js').read_text(encoding='utf-8')
          declared=int(re.search(r'DATABASE_SCHEMA_VERSION\s*=\s*(\d+)',constants).group(1)); versions=[int(v) for v in re.findall(r'migration(\d+)',migrations)]; latest=max(versions) if versions else 0
          if declared!=latest: raise SystemExit(f'Version SQLite incoherente: constante={declared}, derniere migration={latest}')
          print(f'Version SQLite coherente: {declared}')
          PY

      - name: Validate Symfony preparation contract
        run: python .github/scripts/check_symfony_preparation_contract.py

      - name: Validate committed runtime source is immutable
        run: |
          WORK="$RUNNER_TEMP/metra-runtime-verify"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          tar --exclude=.git -cf - . | tar -C "$WORK" -xf -
          cd "$WORK"
          snapshot_runtime() {
            find . -type f ! -path './node_modules/*' -print0 | sort -z | xargs -0 sha256sum | sha256sum
          }
          BEFORE="$(snapshot_runtime)"
          npm run verify:metra
          npm run verify:metra
          AFTER="$(snapshot_runtime)"
          if [ "$BEFORE" != "$AFTER" ]; then
            echo "::error::La vérification METRA a modifié les fichiers source."
            exit 1
          fi
          python .github/scripts/patch_report_mode_defaults.py
          python .github/scripts/patch_hydraulic_feature_build.py
          python .github/scripts/patch_lab_health_build.py
          python .github/scripts/patch_report_professional_layout_build.py
          python .github/scripts/patch_preallumage_report_regressions.py
          python .github/scripts/patch_preallumage_field_ux_build.py
          node --check App.js
          node --check HomeScreen.js
          node --check SiteVisitesScreen.js
          node --check VisiteScreen.js
          node --check visitPrefillDb.js
          node --check reportBuilder.js
          echo "Source runtime vérifiée deux fois sans mutation ; compatibilité des patches Android historiques validée."

      - name: Validate build patch compatibility
        run: |
          python .github/scripts/patch_report_mode_defaults.py
          python .github/scripts/patch_hydraulic_feature_build.py
          python .github/scripts/patch_lab_health_build.py
          python .github/scripts/patch_report_professional_layout_build.py
          python .github/scripts/patch_preallumage_report_regressions.py
          python .github/scripts/patch_preallumage_field_ux_build.py
          node --check reportBuilder.js
          node --check reportEditorExporter.js
          node --check preAllumageReportExporter.js
          node --check preAllumageReportHtml.js
          node --check wordDocxExporter.js
          node --check preAllumageCounterDb.js
          node --check visitPrefillDb.js
          node --check SiteVisitesScreen.js
          node --check persistentEquipmentDb.js
          node --check VisiteScreen.js
          node --check App.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java for PR native validation
        if: github.event_name == 'pull_request'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure npm resilience
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 2000
          npm config set fetch-retry-maxtimeout 30000

      - name: Snapshot tracked source before npm install
        run: git ls-files -z | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/metra-tracked-before.sha256"

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Validate npm install did not mutate tracked source
        run: |
          git ls-files -z | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/metra-tracked-after.sha256"
          diff -u "$RUNNER_TEMP/metra-tracked-before.sha256" "$RUNNER_TEMP/metra-tracked-after.sha256"
          echo "npm ci et postinstall n'ont modifié aucun fichier versionné."

      - name: Check Expo dependency versions
        run: npx expo install --check

      - name: Expo Doctor
        run: npm run doctor

      - name: Validate API integration JavaScript
        run: |
          node --check symfonyApi.js
          node --check intranetVisitPayload.js
          node --check intranetVisitOutboxDb.js
          node --check IntranetVisitSync.js
          node --check symfonyApiCacheDb.js
          node --check latestVisitPhotosDb.js
          node --check latestVisitPhotosStorage.js
          node --check ClientLatestVisitPhotosModal.js
          node --check apiVisitPreparationDb.js
          node --check persistentEquipmentDb.js
          node --check visitPrefillDb.js
          node --check MetraDirectoryScreen.js
          node --check SiteVisitesScreen.js
          node --check HomeScreen.js
          node --check App.js

      - name: Validate native DPoP prebuild on PR
        if: github.event_name == 'pull_request'
        run: |
          npx expo prebuild --clean --platform android --no-install
          test -s android/app/src/main/java/com/metra/dpop/MetraDpopModule.kt
          test -s android/app/src/main/java/com/metra/dpop/MetraDpopPackage.kt
          MAIN_APPLICATION="$(find android/app/src/main/java -type f \( -name 'MainApplication.kt' -o -name 'MainApplication.java' \) -print -quit)"
          test -n "$MAIN_APPLICATION"
          echo "MainApplication généré: $MAIN_APPLICATION"
          grep -q "import com.metra.dpop.MetraDpopPackage" "$MAIN_APPLICATION"
          grep -q "MetraDpopPackage()" "$MAIN_APPLICATION"

      - name: Configure Gradle memory for PR
        if: github.event_name == 'pull_request'
        working-directory: android
        run: |
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.workers.max=2\n' >> gradle.properties

      - name: Compile native Android bridge on PR
        if: github.event_name == 'pull_request'
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --no-daemon --max-workers=2

      - name: Validate JavaScript bundle on PR
        if: github.event_name == 'pull_request'
        run: npx expo export --platform android --output-dir dist-check

      - name: Explain push validation scope
        if: github.event_name == 'push'
        run: echo "Native compilation/export are intentionally skipped here because the push-triggered APK workflow performs the full Expo prebuild and Gradle debug/release builds on the same commit."
