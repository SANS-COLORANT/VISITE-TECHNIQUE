name: Native Android Check

on:
  push:
    branches:
      - native-android
  pull_request:
    branches:
      - native-android

jobs:
  expo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Excel OOXML regression tests
        run: npm run test:excel

      - name: Check Expo dependency versions
        run: npx expo install --check

      - name: Expo Doctor
        run: npx expo-doctor
