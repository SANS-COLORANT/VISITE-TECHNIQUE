name: Native Android Check

on:
  push:
    branches:
      - native-android
  pull_request:
    branches:
      - native-android

jobs:
  expo-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate SQLite schema version
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          constants=Path('database/constants.js').read_text(encoding='utf-8'); migrations=Path('database/migrations/index.js').read_text(encoding='utf-8')
          declared=int(re.search(r'DATABASE_SCHEMA_VERSION\s*=\s*(\d+)',constants).group(1)); versions=[int(v) for v in re.findall(r'migration(\d+)',migrations)]; latest=max(versions) if versions else 0
          if declared!=latest: raise SystemExit(f'Version SQLite incoherente: constante={declared}, derniere migration={latest}')
          print(f'Version SQLite coherente: {declared}')
          PY
      - name: Validate build patch compatibility
        run: |
          python .github/scripts/patch_report_mode_defaults.py
          python .github/scripts/patch_hydraulic_feature_build.py
          python .github/scripts/patch_lab_health_build.py
          python .github/scripts/patch_report_professional_layout_build.py
          python .github/scripts/patch_preallumage_report_regressions.py
          python .github/scripts/patch_preallumage_field_ux_build.py
          node --check reportBuilder.js
          node --check reportEditorExporter.js
          node --check preAllumageReportExporter.js
          node --check preAllumageReportHtml.js
          node --check wordDocxExporter.js
          node --check preAllumageCounterDb.js
          node --check visitPrefillDb.js
          node --check VisiteScreen.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check Expo dependency versions
        run: npx expo install --check
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Validate API integration JavaScript
        run: |
          node --check symfonyApi.js
          node --check symfonyApiCacheDb.js
          node --check apiVisitPreparationDb.js
          node --check MetraDirectoryScreen.js
          node --check HomeScreen.js
          node --check App.js
      - name: Validate native DPoP prebuild
        run: |
          npx expo prebuild --clean --platform android --no-install
          test -s android/app/src/main/java/com/metra/dpop/MetraDpopModule.kt
          test -s android/app/src/main/java/com/metra/dpop/MetraDpopPackage.kt
          MAIN_APPLICATION="$(find android/app/src/main/java -type f \( -name 'MainApplication.kt' -o -name 'MainApplication.java' \) -print -quit)"
          test -n "$MAIN_APPLICATION"
          echo "MainApplication généré: $MAIN_APPLICATION"
          grep -q "import com.metra.dpop.MetraDpopPackage" "$MAIN_APPLICATION"
          grep -q "packages.add(MetraDpopPackage())" "$MAIN_APPLICATION"
      - name: Validate JavaScript bundle
        run: npx expo export --platform android --output-dir dist-check
