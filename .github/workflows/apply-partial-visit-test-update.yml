name: Apply partial visit executable test update

on:
  push:
    branches:
      - perf/metra-global-runtime-audit
    paths:
      - '.github/workflows/apply-partial-visit-test-update.yml'

permissions:
  contents: write

jobs:
  patch-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: perf/metra-global-runtime-audit
          fetch-depth: 0

      - name: Update executable partial-visit regression
        run: python3 .github/scripts/apply_partial_visit_test_update.py

      - name: Validate executable upload tests
        run: |
          node --check .github/scripts/test_intranet_visit_upload.js
          node .github/scripts/check_partial_intranet_visit_contract.js

      - name: Commit updated test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/test_intranet_visit_upload.js
          git diff --cached --quiet && exit 0
          git commit -m "test: couvrir les visites partielles Intranet"
          git push origin HEAD:perf/metra-global-runtime-audit
