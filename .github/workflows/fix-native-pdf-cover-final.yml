name: Finalize Native PDF Cover

on:
  push:
    branches:
      - native-android
    paths:
      - .github/workflows/fix-native-pdf-cover-final.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: native-android
          fetch-depth: 0

      - name: Fetch reference branch
        run: git fetch origin fix/pdf-report-word-layout

      - name: Apply repair
        run: python .github/scripts/fix_native_pdf_cover.py

      - name: Validate
        run: |
          node --check reportBuilder.js
          node --check reportBrandAssets.js
          grep -q "Page 1 is painted from scratch" reportBuilder.js
          grep -q "energieetservice.fr" reportBuilder.js

      - name: Commit repair
        run: |
          rm .github/workflows/fix-native-pdf-cover-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: rebuild native PDF cover from verified images"
          git push origin HEAD:native-android
