name: Finalize Native PDF Cover

on:
  push:
    branches:
      - native-android
    paths:
      - .github/workflows/fix-native-pdf-cover-final.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: native-android
          fetch-depth: 0

      - name: Fetch reference branch
        run: git fetch origin fix/pdf-report-word-layout

      - name: Correct Base64 stream semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/fix_native_pdf_cover.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('def decode_piece(path):')
          end = s.index('\n\nassets = {', start)
          replacement = '''def encoded_piece(path):
              text = git_show(path)
              m = re.search(r"export default ['\\\"]([^'\\\"]+)['\\\"]", text, re.S)
              if not m:
                  raise SystemExit(f'No Base64 payload in {path}')
              return re.sub(r'[^A-Za-z0-9+/=]', '', m.group(1))


def rebuild(paths):
              # V2 files are TEXT slices of one Base64 stream, not independent
              # Base64 documents. Join text first, decode exactly once.
              raw = ''.join(encoded_piece(p) for p in paths)
              raw += '=' * ((4 - len(raw) % 4) % 4)
              data = base64.b64decode(raw, validate=True)
              if not (data.startswith(b'\\xff\\xd8') and data.endswith(b'\\xff\\xd9')):
                  raise SystemExit(f'Invalid JPEG framing: {paths} ({len(data)} bytes)')
              return data
'''
          s = s[:start] + replacement + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply repair
        run: python .github/scripts/fix_native_pdf_cover.py

      - name: Validate
        run: |
          node --check reportBuilder.js
          node --check reportBrandAssets.js
          grep -q "Page 1 is painted from scratch" reportBuilder.js
          grep -q "energieetservice.fr" reportBuilder.js

      - name: Commit repair
        run: |
          rm -rf .tmp_pdf_assets
          rm .github/workflows/fix-native-pdf-cover-final.yml
          rm -f .github/scripts/fix_native_pdf_cover.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: rebuild native PDF cover from verified images"
          git push origin HEAD:native-android
