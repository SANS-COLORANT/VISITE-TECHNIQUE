name: METRA Classic APK Dispatch

on:
  push:
    branches:
      - feat/metra-classic-refresh
    paths:
      - '.github/workflows/metra-classic-apk-dispatch.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Launch production-style APK workflow on this branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
        run: |
          gh api \
            --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${REPO}/actions/workflows/native-android-apk.yml/dispatches" \
            -f "ref=${REF}"
