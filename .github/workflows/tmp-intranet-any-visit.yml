name: Temporary Intranet Any Visit Patch

on:
  push:
    branches:
      - feat/intranet-send-any-visit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply flexible Intranet destination patch
        run: python3 .github/scripts/tmp_patch_intranet_any_visit.py

      - name: Validate dedicated contract
        run: node .github/scripts/check_intranet_any_visit_contract.js

      - name: Validate full METRA source contracts
        run: npm run verify:metra

      - name: Commit prepared source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intranetVisitBindingDb.js IntranetVisitDestinationPicker.js intranetVisitPayload.js IntranetVisitSync.js .github/scripts/check_intranet_any_visit_contract.js .github/scripts/run_source_patches.js docs/INTRANET_VISIT_UPLOAD.md
          git diff --cached --quiet && exit 0
          git commit -m "feat: envoyer toute visite vers une destination Intranet"
          git push origin HEAD:feat/intranet-send-any-visit
