name: Temporary Intranet Any Visit Validation

on:
  push:
    branches:
      - feat/intranet-send-any-visit

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate executable any-visit binding
        run: node .github/scripts/test_intranet_any_visit_binding.js

      - name: Validate full METRA source contracts
        run: npm run verify:metra
