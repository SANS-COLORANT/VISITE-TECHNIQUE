name: Fix PDF Client Cover Scope

on:
  push:
    branches:
      - native-android
    paths:
      - .github/workflows/fix-client-cover-scope.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: native-android

      - name: Fix clientCover scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('reportBuilder.js')
          s = p.read_text()
          old = "  const siteFooter = sites.length === 1 ? sites[0] : `${sites.length} sites sélectionnés`;\n\n  if (format === 'word') {"
          new = "  const siteFooter = sites.length === 1 ? sites[0] : `${sites.length} sites sélectionnés`;\n  const clientCover = datas[0]?.visite?.nom_client || 'Rapport';\n\n  if (format === 'word') {"
          if old not in s:
              raise SystemExit('exporterUnFormat insertion point not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Validate fix
        run: |
          node --check reportBuilder.js
          grep -A8 "async function exporterUnFormat" reportBuilder.js | grep "const clientCover"

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reportBuilder.js
          git commit -m "fix: define PDF cover client in export scope"
          git push origin HEAD:native-android
