name: Trigger global performance APK build

on:
  push:
    branches:
      - perf/metra-global-runtime-audit
    paths:
      - '.github/workflows/trigger-global-perf-apk-build.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch APK workflow on global performance branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run native-android-apk.yml -R SANS-COLORANT/VISITE-TECHNIQUE --ref "${GITHUB_REF_NAME}"

# Re-dispatch after moving LOCAL management from the client list to the selected site and adding a hierarchy regression contract.
