name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - native-android
    paths:
      - '**/*.js'
      - package.json
      - app.json
      - eas.json
      - .github/workflows/native-android-apk.yml

concurrency:
  group: native-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo project
        run: |
          npx expo install --check
          npx expo-doctor

      - name: Validate JavaScript bundle
        run: npx expo export --platform android --output-dir dist-ci

      - name: Generate Android project
        run: npx expo prebuild --clean --platform android --no-install

      - name: Build diagnostic debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload standalone tablet APK
        uses: actions/upload-artifact@v4
        with:
          name: visite-technique-tablet-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: visite-technique-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
