name: Build Native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - native-android
    paths:
      - '**/*.js'
      - 'assets/metra/**'
      - 'visual-packs/**'
      - package.json
      - app.json
      - eas.json
      - .github/workflows/native-android-apk.yml
      - .github/scripts/patch_pdf_cover_fallback_build.py
      - .github/scripts/patch_preallumage_pdf_cover_build.py
      - .github/scripts/patch_report_editor_assets_build.py
      - .github/scripts/patch_excel_import_date.py
      - .github/scripts/patch_report_mode_defaults.py
      - .github/scripts/patch_report_professional_layout_build.py
      - .github/scripts/patch_word_cover_layout.py
      - .github/scripts/patch_word_docx_build.py
      - .github/scripts/patch_word_base64_android_build.py
      - .github/scripts/patch_word_docx_integrity_build.py
      - .github/scripts/generate_word_docx_template_build.py
      - .github/scripts/patch_word_office_compat_build.py
      - .github/scripts/patch_word_template_document_build.py
      - .github/scripts/patch_word_saf_read_build.py
      - .github/scripts/patch_report_preview_toolbar_build.py
      - .github/scripts/patch_report_preview_cover_assets_build.py
      - .github/scripts/patch_hydraulic_feature_build.py
      - .github/scripts/patch_lab_health_build.py

concurrency:
  group: native-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_ENV: production
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        -Dorg.gradle.workers.max=2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Google Maps build configuration
        run: |
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then
            echo "Google Maps Android key available for this build."
          else
            echo "Google Maps Android key not configured; METRA offline fallback will remain active."
          fi

      - name: Stamp visible APK build number
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('appVersion.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("export const APK_BUILD = 'DEV';", "export const APK_BUILD = '${{ github.run_number }}';")
          p.write_text(s, encoding='utf-8')
          PY
          grep -q "APK_BUILD = '${{ github.run_number }}'" appVersion.js

      - name: Apply targeted Excel import date cleanup
        run: python .github/scripts/patch_excel_import_date.py

      - name: Apply report selection mode defaults
        run: |
          python .github/scripts/patch_report_mode_defaults.py
          node --check ReportScreen.js
          grep -q "const groupeInterdit=selected.size<=1" ReportScreen.js
          grep -q "const modeEffectif=datas.length<=1?'site':mode" ReportScreen.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo project
        run: |
          npx expo install --check
          npx expo-doctor

      - name: Generate Office-compatible Word skeleton
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir python-docx==1.2.0
          python .github/scripts/generate_word_docx_template_build.py
          test -s wordDocxTemplate.generated.js
          grep -q "WORD_DOCX_TEMPLATE_BASE64" wordDocxTemplate.generated.js

      - name: Generate exact PDF assets from untouched files
        run: python .github/scripts/patch_pdf_cover_fallback_build.py

      - name: Apply exact assets to editable PDF reports
        run: |
          python .github/scripts/patch_report_editor_assets_build.py
          node --check reportEditorExporter.js
          grep -q "embedExactSafe(EXACT_COVER, 'png')" reportEditorExporter.js
          grep -q "embedExactSafe(EXACT_LOGO, 'png')" reportEditorExporter.js
          grep -q "embedExactSafe(EXACT_FOOTER_CERT, 'png')" reportEditorExporter.js

      - name: Apply exact Pre-allumage PDF cover
        run: |
          python .github/scripts/patch_preallumage_pdf_cover_build.py
          node --check preAllumageReportExporter.js
          grep -q "pdf.embedPng(EXACT_COVER)" preAllumageReportExporter.js
          grep -q "pdf.embedPng(EXACT_LOGO)" preAllumageReportExporter.js
          grep -q "pdf.embedPng(EXACT_FOOTER_CERT)" preAllumageReportExporter.js

      - name: Apply Word-only stable cover
        run: |
          python .github/scripts/patch_word_cover_layout.py
          node --check reportBuilder.js
          grep -q "function wordCoverHtml" reportBuilder.js
          grep -q "const coverHtml = output === 'word'" reportBuilder.js
          grep -q "EXACT_FOOTER_CERT" reportBuilder.js

      - name: Apply real DOCX report exports
        run: |
          python .github/scripts/patch_word_docx_build.py
          node --check wordDocxExporter.js
          node --check reportBuilder.js
          node --check reportEditorExporter.js
          node --check preAllumageReportExporter.js
          grep -q ".docx" reportBuilder.js
          grep -q "datas: rendered.preparedDatas" reportEditorExporter.js
          grep -q "Rapport Pré-allumage" preAllumageReportExporter.js

      - name: Harden Android Word base64 writes
        run: |
          python .github/scripts/patch_word_base64_android_build.py
          node --check wordDocxExporter.js
          grep -q "function writeBase64Async" wordDocxExporter.js
          grep -q "fichier DOCX final" wordDocxExporter.js

      - name: Apply improved report preview toolbar
        run: |
          python .github/scripts/patch_report_preview_toolbar_build.py
          node --check ReportLayoutEditor.js
          grep -q "Prévisualisation du rapport" ReportLayoutEditor.js
          grep -q "Prévisualisation A4" ReportLayoutEditor.js
          grep -q "maxWidth: 520" ReportLayoutEditor.js
          grep -q "minWidth: 205" ReportLayoutEditor.js

      - name: Apply real cover assets to report preview
        run: |
          python .github/scripts/patch_report_preview_cover_assets_build.py
          node --check ReportLayoutEditor.js
          grep -q "PREVIEW_LOGO" ReportLayoutEditor.js
          grep -q "PREVIEW_CERT" ReportLayoutEditor.js
          grep -q "PREVIEW_SPIRALS" ReportLayoutEditor.js

      - name: Apply hydraulic LAB feature gate
        run: |
          python .github/scripts/patch_hydraulic_feature_build.py
          grep -q "subscribeLabFeatureChanges" App.js
          grep -q "hydraulicVisible ?" App.js
          ! grep -q "HydraulicFeatureSettingRow" App.js

      - name: Apply METRA LAB health dashboard
        run: |
          python .github/scripts/patch_lab_health_build.py
          node --check siteHealth.js
          node --check reportBuilder.js
          node --check wordDocxExporter.js
          grep -q "LAB METRA" ParametresScreen.js
          grep -q "SiteHealthPanel" SiteVisitesScreen.js
          grep -q "Santé du patrimoine (LAB)" ReportScreen.js
          grep -q "construireSanteMultiHtml" reportBuilder.js
          grep -q "multiHealthXml" wordDocxExporter.js

      - name: Apply professional PDF layout to all models
        run: |
          python .github/scripts/patch_report_professional_layout_build.py
          node --check reportBuilder.js
          node --check reportEditorExporter.js
          node --check preAllumageReportExporter.js
          node --check preAllumageReportHtml.js
          grep -q "PROFESSIONAL_REPORT_LAYOUT_V1" reportBuilder.js
          grep -q "Criticité" reportBuilder.js
          grep -q "photoCount-6" reportBuilder.js
          grep -q "photoCount-6" reportEditorExporter.js
          grep -q "Périmètre :" reportBuilder.js

      - name: Validate final Word DOCX integrity and cover
        run: |
          python .github/scripts/patch_word_docx_integrity_build.py
          node --check wordDocxExporter.js
          grep -q "sanitizeXmlText" wordDocxExporter.js
          grep -q "validateDocxPackage" wordDocxExporter.js
          grep -q "REPORT_OPQIBI" wordDocxExporter.js
          grep -q "WORD_COVER_ASSET" wordDocxExporter.js
          grep -q "signature ZIP PK absente" wordDocxExporter.js
          grep -q "SAF.createFileAsync(dossier, safName, MIME_DOCX)" wordDocxExporter.js

      - name: Apply Office-compatible DOCX package
        run: |
          python .github/scripts/patch_word_office_compat_build.py
          node --check wordDocxExporter.js
          grep -q "WORD_DOCX_TEMPLATE_BASE64" wordDocxExporter.js
          grep -q "gabarit DOCX Office" wordDocxExporter.js
          grep -q "let nextRel = 100" wordDocxExporter.js
          grep -q "word/settings.xml" wordDocxExporter.js
          grep -q "word/theme/theme1.xml" wordDocxExporter.js

      - name: Preserve Office document XML shell
        run: |
          python .github/scripts/patch_word_template_document_build.py
          node --check wordDocxExporter.js
          grep -q "baseDocumentXml" wordDocxExporter.js
          grep -q "propriétés de section absentes" wordDocxExporter.js
          grep -q "relation image" wordDocxExporter.js

      - name: Fix Android Word SAF read-back
        run: |
          python .github/scripts/patch_word_saf_read_build.py
          node --check wordDocxExporter.js
          grep -q "FileSystem.readAsStringAsync(destination" wordDocxExporter.js
          ! grep -q "SAF.readAsStringAsync(destination" wordDocxExporter.js

      - name: Validate exact PDF cover patch
        run: |
          node --check reportBuilder.js
          test -s reportExactAssets.generated.js
          grep -q "embedExactSafe(EXACT_COVER, 'png')" reportBuilder.js
          grep -q "embedExactSafe(EXACT_LOGO, 'png')" reportBuilder.js
          grep -q "EXACT_SPIRAL_4" reportBuilder.js

      - name: Validate JavaScript bundle
        run: npx expo export --platform android --output-dir dist-ci

      - name: Generate Android project
        run: npx expo prebuild --clean --platform android --no-install

      - name: Configure Gradle memory
        working-directory: android
        run: |
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.workers.max=2\n' >> gradle.properties

      - name: Build diagnostic debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --max-workers=2

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2

      - name: Upload standalone tablet APK
        uses: actions/upload-artifact@v4
        with:
          name: visite-technique-tablet-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: visite-technique-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
