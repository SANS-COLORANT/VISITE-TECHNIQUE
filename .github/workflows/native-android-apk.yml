name: Build Native APK
run-name: "Build Native APK #${{ github.run_number }}"
on:
  workflow_dispatch:
  push:
    branches:
      - native-android
      - feat/trame-remar-complete
      - feat/terrain-feedback-all-phases-20261027
      - fix/rcu-intranet-summary-20261028
      - feat/intranet-universal-v2-safety-20261028
      - feat/intranet-v2-catalog-hardening-20261028
      - fix/rcu-unscoped-report-sticky-20261028
      - fix/universal-intranet-mapping-material-reconciliation-20261028
      - fix/visit-upload-field-identity-and-equipment-dup-20261028
      - fix/intranet-trame-selection-20261102
      - feat/remar-dynamic-every-tab-20261102
      - fix/remar-intranet-diagnostics-20261102
      - fix/remar-complete-symfony-20261103
      - feat/premium-cards-control-photos-20261103
      - fix/visit-history-remar-default-resync-selection-20261103
      - fix/intranet-text-preservation-client-progress-20261104
      - fix/metra-runtime-data-safety-20261104
      - feat/remove-companion-add-credits-20261104
      - fix/metra-lot05-complete-workstreams-20261105
      - fix/metra-lot06-report-fidelity-20261105
      - fix/metra-date-photos-report-apk-20261110
      - fix/rcu-network-intranet-fallback-20261110
      - fix/rcu-six-network-slots-20261110
    paths:
      - '**/*.js'
      - '**/*.json'
      - '**/*.mjs'
      - 'native/**'
      - 'plugins/**'
      - 'database/**'
      - 'assets/metra/**'
      - '.github/workflows/native-android-apk.yml'
      - '.github/scripts/smoke_remar_android.py'
permissions:
  contents: read
concurrency:
  group: native-android-apk-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      METRA_RELEASE_STORE_PASSWORD: android
      METRA_RELEASE_KEY_ALIAS: androiddebugkey
      METRA_RELEASE_KEY_PASSWORD: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install verified committed source
        run: |
          npm ci --no-audit --no-fund --prefer-offline
          git diff --exit-code
      - name: Verify complete committed METRA contracts, SQLite and regressions
        run: npm run verify:metra
      - name: Test all 141 REMAR mappings, multi-line meters and multiple CTA/VMC
        env:
          NODE_OPTIONS: '--require=./.github/scripts/test_legacy_alias_globals.js'
        run: |
          node .github/scripts/test_remar_141_intranet_matrix.js
          node .github/scripts/test_remar_remote_trame_selection.js
          node .github/scripts/test_remar_complete_20261103.js
          node .github/scripts/test_premium_cards_control_photos.js
          node .github/scripts/test_visit_latest_copy_and_client_send.js
          node .github/scripts/test_intranet_error_diagnostics.js
          node .github/scripts/test_intranet_any_visit_binding.js
      - name: Test REMAR, editable trames and real SQLite round trips
        run: node --experimental-test-module-mocks --test tests/trameRemar.test.mjs
      - name: Preserve large PDF report regression (457 photos)
        run: node tests/reportPdfFragments.test.mjs
      - name: Stamp Android update version (packaging only)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os, time
          p = Path('app.json')
          data = json.loads(p.read_text())
          assert data['expo']['android']['package'] == 'com.visitetechnique.tablet'
          data['expo']['android']['versionCode'] = int(time.time())
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          version = Path('appVersion.js')
          version.write_text(version.read_text().replace("APK_BUILD = 'DEV'", "APK_BUILD = '" + os.environ['BUILD_NUMBER'] + "'"))
          Path('/tmp/metra-version-code').write_text(str(data['expo']['android']['versionCode']))
          PY
      - name: Validate complete Android bundle
        run: npx expo export --platform android --max-workers 2 --output-dir dist-remar-ci
      - name: Generate native project without runtime patches
        run: |
          npx expo prebuild --clean --platform android --no-install --skip-dependency-update react,react-native
          test -s android/gradlew
          git diff --exit-code -- '*.js' ':!appVersion.js' ':!googleMapsRuntime.generated.js'
      - name: Preserve historical METRA signing identity
        run: |
          set -euo pipefail
          actual="$(keytool -list -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey | awk -F'SHA256: ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$actual" = FAC61745DC0903786FB9EDE62A962B399F7348F0BB6F899B8332667591033B9C
          cp android/app/debug.keystore android/app/metra-release.keystore
          python3 .github/scripts/configure_android_release_signing.py
      - name: Build complete standalone release
        working-directory: android
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            echo "Native Gradle release attempt ${attempt}/3"
            log="$RUNNER_TEMP/metra-native-gradle-${attempt}.log"
            if ./gradlew assembleRelease --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.http.socketTimeout=240000 -Pkotlin.compiler.execution.strategy=in-process -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 2>&1 | tee "$log"; then
              exit 0
            fi
            if ! grep -Eiq '(Read timed out|Connect timed out|Connection reset|Could not download .*\\.aar|Could not get resource|Temporary failure in name resolution)' "$log"; then
              echo "::error::Gradle failure is not a transient artifact download: no automatic retry."
              exit 1
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Maven dependency download failed after three attempts."
              exit 1
            fi
            echo "::warning::Transient Maven/Gradle download timeout; retrying release with same source and signing key."
            sleep $((attempt * 20))
          done
      - name: Verify Android update identity and signature
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/Build-Native-APK-${BUILD_NUMBER}.apk"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$tools/apksigner" verify --verbose --print-certs "release/Build-Native-APK-${BUILD_NUMBER}.apk" > /tmp/metra-signer.txt
          cat /tmp/metra-signer.txt
          grep -qi 'fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c' /tmp/metra-signer.txt
          "$tools/aapt" dump badging "release/Build-Native-APK-${BUILD_NUMBER}.apk" > /tmp/metra-badging.txt
          head -1 /tmp/metra-badging.txt | grep "name='com.visitetechnique.tablet'"
          grep "versionCode='$(cat /tmp/metra-version-code)'" /tmp/metra-badging.txt
          git diff --exit-code -- '*.js' ':!appVersion.js' ':!googleMapsRuntime.generated.js'
          cd release
          sha256sum "Build-Native-APK-${BUILD_NUMBER}.apk" > "Build-Native-APK-${BUILD_NUMBER}.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Build-Native-APK-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
  android-smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Build-Native-APK-${{ github.run_number }}
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch signed METRA APK and check startup and trame editor
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 .github/scripts/smoke_remar_android.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-Native-APK-${{ github.run_number }}-android-smoke
          path: shots/
          if-no-files-found: warn
          retention-days: 30
  publish:
    needs: [build, android-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Build-Native-APK-${{ github.run_number }}
          path: release
      - name: Publish the complete METRA APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          cat > /tmp/release-notes.md <<'NOTES'
          METRA — Visite Technique : APK natif de recette du 5 novembre 2026.
          Source : branche fix/metra-lot06-report-fidelity-20261105,
          créée à la suite des correctifs LOT05 / build #868.
          Conserve les améliorations de navigation, les trames et l’Intranet.
          Conserve les corrections précédentes des trames ICPE, REMAR, VMC,
          Réseau de chaleur, Pré-allumage, ainsi que les fonctions Intranet.

          Lot 06 (fidélité des rapports, export Excel/PDF/Word) :
          - Pré-allumage : toutes les rubriques techniques déjà enregistrées
            sont projetées dans les rapports, sans les réafficher dans l’UI.
          - REMAR : anciennes valeurs plates non reprises lorsque l’objet
            dynamique courant fait autorité ; pas de modification SQLite.
          - Réseaux : relevés structurés, programmes et mesures libres dans les
            rapports ; date métier des réserves harmonisée.
          - Signature Word : tracé PNG dans le document .doc existant ; photo
            illisible incluse = erreur explicite, non omission silencieuse.
          - Rapports PA spécialisés : annexes réserves/photos autorisées/signature.
          - Excel : champs délai/avancement restaurés quand le modèle les porte,
            import des grandes tables sans limite silencieuse de 497 lignes,
            légendes des photos exclues masquées.
          - Rapports par site/local : bilan des succès et des erreurs, reprise
            ciblée, choix de couverture conservé et nouveaux dossiers avec ID.
          - Aperçu riche en photos : PDF fragmenté au-delà de 8 médias.
          - Missions conditionnel : sortie durable et paquet signalé incomplet
            si des couches hors ligne n’ont pas été copiées.
          - Unicode PDF : repli sur le PDF imprimé intégral lorsqu’une police
            standard ne peut pas dessiner le texte d’habillage (habillage
            graphique secondaire indisponible dans ce seul cas).

          Recette restante avant tout usage en production :
          - Lire réellement dans Word et LibreOffice les .doc et signatures.
          - Comparer les cellules des modèles historiques ICPE/RCU/REMAR/PA/VMC
            et faire les retours Excel > 500 lignes avec une base de test.
          - Vérifier la mise en page PDF/Word, volumes de photos et politiques
            d’exclusion sur la tablette cible.
          - Les tests CI ne constituent pas une preuve de parité parfaite des
            fichiers Office et PDF sur tous les logiciels.

          Lot 05 (fluidité sans changement des règles métier) :
          - Ouverture client/site/local plus réactive par réutilisation du cache
            récent ; l'invalidation reste prioritaire après les mutations.
          - Locaux Intranet non matérialisés visibles sans écriture déclenchée
            au simple toucher ; création locale à l'ouverture explicite.
          - Reprise de la navigation VMC et Pré-allumage mieux protégée.
          - Moins de chargements redondants et calcul commun des états d'onglets
            et de la progression.
          - Recherche de champ ciblant rubrique et emplacement ; compteurs
            volumineux et listes réseaux REMAR mieux virtualisés.
          - Protections antérieures du défilement, des recherches et des photos
            contre les réponses asynchrones obsolètes.

          - Import/expédition Intranet : la liste de matériel de la visite fait
            foi (ajout, modification, suppression, inventaire vide) dans les
            nouvelles visites, pour ICPE, REMAR, Réseau de chaleur, VMC,
            Pré-allumage et les trames prises en charge par le même moteur.
          - Réimport : rapprochement des équipements par local sans fusionner
            deux appareils homonymes ; matériel retiré du patrimoine courant,
            historique des observations/visites conservé.
          - Client > Envoyer : sélection des dernières visites non synchronisées
            par site et local. Suivi des confirmations (visites + photos) avec
            volume en Ko, Mo ou Go ; tailles locales connues uniquement.
          - Saisie hors enum Symfony (ex. état « Dégradé ») conservée dans les
            notes de visite envoyées. L'affichage de cet état directement dans
            le champ matériel Intranet nécessite un contrat Symfony adapté.

          Important — limites de cette version de recette :
          - Le POST existant crée une nouvelle visite. Les changements d'une
            visite déjà synchronisée sont détectés mais ne sont PAS renvoyés :
            un PATCH/PUT Symfony officiel est encore nécessaire pour éviter
            un doublon de visite.
          - Les prévalidations locales et les tests SQLite/Android ne prouvent
            pas que l'Intranet de production accepte le remplacement intégral
            du patrimoine ou un listing entièrement vide. Vérifier les effets
            sur un client/local de recette avant utilisation en production.
          - Certaines saisies REMAR non mappées aux critères Symfony restent
            bloquantes ; ce chantier global n'est pas déclaré terminé.
          - Ne pas réimporter un patrimoine de production depuis une APK de
            recette sans sauvegarde préalable du SQLite, des visites et photos.

          APK natif signé avec la même identité Android
          com.visitetechnique.tablet et le certificat historique METRA ;
          versionCode croissant, numéro de build continu. Aucun suffixe REMAR
          dans le nom au lancement.

          Vérifications du workflow : contrats METRA, vrais tests SQLite,
          exports, bundle Android, compilation Gradle, signature et tests de
          démarrage sur émulateur. Aucune authentification ni modification
          réelle du patrimoine Symfony de production dans cette CI.
          NOTES
          gh release create "build-native-apk-${BUILD_NUMBER}" release/* --target "$GITHUB_SHA" --title "Build Native APK #${BUILD_NUMBER}" --notes-file /tmp/release-notes.md --prerelease
