name: REMAR meters and free photos QA
on:
  push:
    branches:
      - feat/remar-meters-free-photos-20261027
  pull_request:
    branches:
      - feat/remar-ergonomie-terrain-20261027
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify unmodified committed runtime and all legacy METRA contracts
        run: |
          npm ci --no-audit --no-fund --prefer-offline
          git diff --exit-code
      - name: Validate privacy migration and Intranet worker with real SQLite
        run: node .github/scripts/test_remar_meters_free_photos.js
      - name: Validate legacy meters and temperatures multiline
        run: node .github/scripts/test_releve_multiligne.js
      - name: REMAR workbook import/export and all 141 points on real SQLite
        run: node --experimental-test-module-mocks --test tests/trameRemar.test.mjs
      - name: Preserve PDF 457 photo report regression
        run: node tests/reportPdfFragments.test.mjs
      - name: Validate complete Android JS bundle (not a signed APK)
        run: npx expo export --platform android --max-workers 2 --output-dir dist-remar-meters-photos-ci
