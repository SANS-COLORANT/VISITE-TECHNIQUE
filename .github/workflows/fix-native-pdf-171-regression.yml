name: Fix Native PDF 171 Regression

on:
  push:
    branches:
      - native-android
    paths:
      - .github/workflows/fix-native-pdf-171-regression.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native Android
        uses: actions/checkout@v4
        with:
          ref: native-android
          fetch-depth: 0

      - name: Patch PDF asset loading and cover sizing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('reportBuilder.js')
          s = p.read_text(encoding='utf-8')

          start = s.index('async function lireAssetBinaire(moduleId) {')
          end = s.index('\nasync function habillerPdf(', start)
          new_loader = r'''async function lireAssetBinaire(moduleId) {
            const asset = Asset.fromModule(moduleId);

            // Ne rematerialise pas un asset deja disponible localement : sur le
            // build 171, downloadAsync() systematique pouvait laisser l'export PDF
            // en attente indefiniment sur Android release.
            if (asset.localUri) {
              return FileSystem.readAsStringAsync(asset.localUri, {
                encoding: FileSystem.EncodingType.Base64,
              });
            }

            // Si l'asset n'est pas encore local, on autorise une materialisation
            // courte. Un asset de garde ne doit jamais pouvoir bloquer tout le PDF.
            try {
              const charge = await Promise.race([
                asset.downloadAsync(),
                new Promise((_, reject) => setTimeout(
                  () => reject(new Error('Timeout de materialisation asset PDF')),
                  5000
                )),
              ]);
              const localUri = charge?.localUri || asset.localUri;
              if (localUri) {
                return FileSystem.readAsStringAsync(localUri, {
                  encoding: FileSystem.EncodingType.Base64,
                });
              }
            } catch (error) {
              console.warn('Materialisation asset PDF impossible', error);
            }

            // Fallback Metro/developpement uniquement. On evite les fetch sur URI
            // APK/file/content, qui sont non fiables dans l'APK Android installe.
            const uri = String(asset.uri || '');
            if (/^https?:/i.test(uri)) {
              const response = await Promise.race([
                fetch(uri),
                new Promise((_, reject) => setTimeout(
                  () => reject(new Error('Timeout de lecture asset PDF')),
                  5000
                )),
              ]);
              if (!response.ok) throw new Error(`Lecture asset PDF impossible (${response.status}).`);
              const buffer = await response.arrayBuffer();
              if (buffer.byteLength > 0) return new Uint8Array(buffer);
            }

            throw new Error('Asset de rapport introuvable ou illisible dans le bundle Android.');
          }'''
          s = s[:start] + new_loader + s[end:]

          replacements = {
              "fit(coverLogoImage, mm(63), mm(18))": "fit(coverLogoImage, mm(93), mm(22))",
              "x: mm(20),\n          y: height - mm(14) - sLogo.height,": "x: mm(15),\n          y: height - mm(11) - sLogo.height,",
              "fit(coverVisualImage, mm(140), mm(89))": "fit(coverVisualImage, mm(159), mm(99))",
              "const iconSize = mm(3.2);": "const iconSize = mm(6);",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Replacement target not found: {old}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript and native assets
        run: |
          node --check reportBuilder.js
          grep -q "if (asset.localUri)" reportBuilder.js
          grep -q "Timeout de materialisation asset PDF" reportBuilder.js
          grep -q "fit(coverLogoImage, mm(93), mm(22))" reportBuilder.js
          grep -q "fit(coverVisualImage, mm(159), mm(99))" reportBuilder.js
          grep -q "const iconSize = mm(6);" reportBuilder.js
          test -f assets/report/cover-building.png
          test -f assets/report/brand-logo.png
          test -f assets/report/spiral-red-orange.jpg
          test -f assets/report/spiral-yellow-green.jpg
          test -f assets/report/spiral-green-red.jpg
          test -f assets/report/spiral-multicolor-alt.jpg
          test -f assets/report/spiral-multicolor.png

      - name: Commit correction and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-native-pdf-171-regression.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reportBuilder.js .github/workflows/fix-native-pdf-171-regression.yml
          git commit -m "fix: prevent native PDF asset hang and match cover assets"
          git push origin HEAD:native-android
