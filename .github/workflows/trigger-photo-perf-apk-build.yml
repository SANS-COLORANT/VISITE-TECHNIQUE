name: Trigger photo performance APK build

on:
  push:
    branches:
      - perf/metra-intranet-photo-download
    paths:
      - '.github/workflows/trigger-photo-perf-apk-build.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch APK workflow on photo performance branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run native-android-apk.yml -R SANS-COLORANT/VISITE-TECHNIQUE --ref "${GITHUB_REF_NAME}"
