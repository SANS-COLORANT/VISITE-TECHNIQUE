name: PDF OOM and Photos UX QA

on:
  pull_request:
    branches:
      - claude/new-session-ysrt94
    paths:
      - 'reportPdfFragments.js'
      - 'reportBuilder.js'
      - 'reportEditorExporter.js'
      - 'ReportScreen.js'
      - 'ReportLayoutEditor.js'
      - 'tests/reportPdfFragments.test.mjs'
      - '.github/workflows/report-pdf-oom-qa.yml'
  workflow_dispatch:

jobs:
  report-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Validate fragmented PDF structure (457 synthetic photos)
        run: node --experimental-default-type=module tests/reportPdfFragments.test.mjs
      - name: Verify JS syntax
        run: node --experimental-default-type=module --check reportPdfFragments.js
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Validate Android JS bundle
        run: npx expo export --platform android --output-dir dist-report-qa
