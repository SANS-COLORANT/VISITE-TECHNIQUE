name: Restore PDF export function

on:
  push:
    branches:
      - fix/pdf-report-word-layout
    paths:
      - .github/workflows/restore-pdf-export-function.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/pdf-report-word-layout
          fetch-depth: 0

      - name: Restore exporterUnFormat from known-good revision
        run: |
          git show 3130529c509dfc096514cce16c2d8ca40d03a7ef:reportBuilder.js > /tmp/reportBuilder-good.js
          python -c "from pathlib import Path; import re; p=Path('reportBuilder.js'); s=p.read_text(encoding='utf-8'); old=Path('/tmp/reportBuilder-good.js').read_text(encoding='utf-8'); m=re.search(r'async function exporterUnFormat\([\s\S]*?\n}\n\nexport async function exporterRapport\(', old); assert m, 'exporterUnFormat introuvable dans la revision de reference'; fn=m.group(0).rsplit('export async function exporterRapport(',1)[0]; marker='export async function exporterRapport('; assert marker in s, 'exporterRapport introuvable'; p.write_text(s if 'async function exporterUnFormat(' in s else s.replace(marker, fn+marker, 1), encoding='utf-8')"

      - name: Verify restored function
        run: |
          grep -n "async function exporterUnFormat" reportBuilder.js
          grep -n "export async function exporterRapport" reportBuilder.js

      - name: Validate JavaScript bundle
        run: |
          npm install --no-audit --no-fund
          npx expo export --platform android --output-dir dist-ci

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reportBuilder.js
          git commit -m "fix: restore PDF export execution path" || exit 0
          git push origin HEAD:fix/pdf-report-word-layout
