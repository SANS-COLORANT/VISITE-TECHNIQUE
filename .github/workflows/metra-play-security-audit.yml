name: METRA Play Store - security and dependency audit

on:
  push:
    branches:
      - release/metra-playstore-secure-20261120
      - fix/play-astra-security-m01-m07-20261120
      - fix/play-astra-m04-m05-20261120
      - fix/astra20-intranet-reliability-20261120
    paths:
      - '.github/workflows/metra-play-security-audit.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'app.config.js'
      - 'plugins/**'
      - 'native/**'
      - '.github/scripts/verify_play_security.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supply-chain:
    name: Current source and production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check source for hard-coded credentials without printing secret values
        run: python3 .github/scripts/verify_play_security.py
      - name: Verify Play privacy link is planned
        run: |
          if grep -Eiq 'privacy.?policy|politique de confidentialit' App.js ParametresScreen.js; then
            echo 'Privacy disclosure text found in current application UI. Verify actual clickable URL and policy content.'
          else
            echo '::warning::No METRA privacy policy link found in the application UI. Google Play submission remains blocked.'
          fi
      - name: Install exactly locked dependencies without postinstall hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies only
        id: deps
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/metra-audit.json" || true
          python3 - <<'PY'
          import collections, json, os
          source = os.environ['RUNNER_TEMP'] + '/metra-audit.json'
          with open(source, encoding='utf-8') as f:
              report=json.load(f)
          vulns=report.get('vulnerabilities')
          if not isinstance(vulns,dict):
              raise SystemExit('npm audit did not return a valid vulnerability report.')
          summary=collections.Counter(str(v.get('severity','unknown')) for v in vulns.values())
          print('PRODUCTION NPM AUDIT:', dict(summary))
          for name,entry in sorted(vulns.items()):
              print('PACKAGE:', name, 'SEVERITY:', entry.get('severity','unknown'))
          if summary.get('critical',0) or summary.get('high',0):
              raise SystemExit('Production dependencies contain high/critical advisories; review and remediate before Play release.')
          PY

  history-secret-scan:
    name: Check repository history for leaked credentials
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify full Git history is available
        run: |
          count="$(git rev-list --all --count)"
          echo "Git commits available for historical secret scan: $count"
          if [ "$count" -lt 500 ]; then
            echo '::error::Git history appears shallow; refusing incomplete secret audit.'
            exit 1
          fi
      - name: Scan FULL Git history with Gitleaks (redacted, no published artifact)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          set +e
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="--all" --report-format=json --report-path="$RUNNER_TEMP/gitleaks-redacted.json" .
          code=$?
          set -e
          python3 - <<'PY'
          from collections import Counter
          from pathlib import Path
          import json, os
          p=Path(os.environ['RUNNER_TEMP'])/'gitleaks-redacted.json'
          items=json.loads(p.read_text(encoding='utf-8')) if p.is_file() else []
          if not isinstance(items,list):
              raise SystemExit('Gitleaks report malformed')
          rules=Counter(str(x.get('RuleID','unknown')) for x in items)
          categories=Counter(str(x.get('File','')).split('/')[0] or '(root)' for x in items)
          print('GITLEAKS DETECTION COUNT:',len(items))
          print('GITLEAKS RULE CATEGORIES:',dict(rules))
          print('GITLEAKS TOP-LEVEL SOURCE AREAS:',dict(categories))
          print('Actual matched values, file paths, commit hashes and line content are deliberately not published.')
          PY
          exit "$code"
