name: Bootstrap package-lock

on:
  push:
    branches:
      - infra/reproducible-npm-install

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: ${{ github.event.head_commit.message != 'build: add reproducible npm lockfile' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate package-lock without running METRA patches
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile can drive a clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile and remove bootstrap workflow
        run: |
          set -euo pipefail
          test -s package-lock.json
          git rm .github/workflows/bootstrap-package-lock.yml
          git add package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: add reproducible npm lockfile"
          git push origin HEAD:infra/reproducible-npm-install
