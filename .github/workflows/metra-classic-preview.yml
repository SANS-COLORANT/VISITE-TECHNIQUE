name: METRA Classic Preview APK

on:
  push:
    branches:
      - feat/metra-classic-refresh
    paths:
      - '**/*.js'
      - '**/*.json'
      - 'visual-packs/**'
      - 'assets/metra/**'
      - 'plugins/**'
      - 'native/**'
      - '.github/scripts/**'
      - '.github/workflows/metra-classic-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  classic-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify classic METRA is the active baseline
        run: node .github/scripts/check_classic_metra_mode.js

  build-classic-preview:
    needs: classic-guard
    uses: SANS-COLORANT/VISITE-TECHNIQUE/.github/workflows/native-android-ui-preview.yml@feat/metra-classic-refresh
    with:
      build_ref: ${{ github.sha }}
    permissions:
      contents: write
