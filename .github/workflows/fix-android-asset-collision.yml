name: Fix Android Report Asset Collision

on:
  push:
    branches: [native-android]
    paths:
      - '.github/workflows/fix-android-asset-collision.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update report asset reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('reportBuilder.js')
          s = p.read_text()
          old = "require('./assets/report/spiral-multicolor.jpg')"
          new = "require('./assets/report/spiral-multicolor-alt.jpg')"
          if old not in s:
              raise SystemExit('Expected asset reference not found')
          p.write_text(s.replace(old, new, 1))
          PY
          node --check reportBuilder.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reportBuilder.js
          git commit -m 'fix: use unique Android report resource name'
          git push
