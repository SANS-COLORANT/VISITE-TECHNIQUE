name: Materialize runtime source

on:
  push:
    branches:
      - refactor/materialize-runtime-source

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Materialize canonical METRA runtime source
        run: npm run prepare:metra

      - name: Verify preparation is idempotent
        run: |
          git diff --binary > "$RUNNER_TEMP/metra-first.diff"
          npm run prepare:metra
          git diff --binary > "$RUNNER_TEMP/metra-second.diff"
          cmp "$RUNNER_TEMP/metra-first.diff" "$RUNNER_TEMP/metra-second.diff"
          git diff --check

      - name: Guard workflow files from generated changes
        run: |
          if git diff --name-only | grep -q '^\.github/workflows/'; then
            echo "::error::Runtime materialization unexpectedly modified a workflow file."
            git diff --name-only
            exit 1
          fi
          echo "Materialized source files:"
          git diff --name-only

      - name: Commit materialized source
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No runtime source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: materialize prepared METRA runtime source"
          git push origin HEAD:refactor/materialize-runtime-source
