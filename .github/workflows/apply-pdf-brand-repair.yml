name: Apply validated PDF branding repair

on:
  push:
    branches:
      - fix/pdf-report-word-layout
    paths:
      - .github/workflows/apply-pdf-brand-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-pdf-branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          ref: fix/pdf-report-word-layout
          fetch-depth: 0

      - name: Restore validated Word visuals
        run: git checkout 4ebf7d9e6966324fffde185455a609bec2c7ad2f -- reportBrandAssets.js

      - name: Remove double cover and use exact standalone mark
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('reportBuilder.js')
          s = p.read_text(encoding='utf-8')

          old_import = "import { REPORT_COVER, REPORT_LOGO, REPORT_OPQIBI } from './reportBrandAssets.js';"
          new_import = "import { REPORT_COVER, REPORT_LOGO, REPORT_MARK, REPORT_OPQIBI } from './reportBrandAssets.js';"
          if old_import in s:
              s = s.replace(old_import, new_import, 1)
          elif new_import not in s:
              raise SystemExit('report asset import not found')

          s = s.replace(
              ".coverClient{position:absolute;left:12mm;right:12mm;top:49mm;height:20mm;background:${ORANGE};color:#fff;border-radius:5mm;text-align:center;padding:0;font-size:18pt;font-weight:700;z-index:3;display:flex;align-items:center;justify-content:center};color:#fff;border-radius:6mm;text-align:center;padding:8mm 6mm;font-size:23pt;font-weight:700;z-index:3}",
              ".coverClient{position:absolute;left:12mm;right:12mm;top:49mm;height:20mm;background:${ORANGE};color:#fff;border-radius:5mm;text-align:center;padding:0;font-size:18pt;font-weight:700;z-index:3;display:flex;align-items:center;justify-content:center}",
              1,
          )

          # Replace all cover/logo/opqibi pdf-lib embeds with the exact standalone mark.
          embed_pattern = re.compile(
              r"\s*let logo = null;\s*let cover = null;\s*let opqibi = null;\s*"
              r"try \{ logo = await pdf\.embedJpg\(dataUriBase64\(REPORT_LOGO\)\); \} catch \{\}\s*"
              r"try \{ cover = await pdf\.embedJpg\(dataUriBase64\(REPORT_COVER\)\); \} catch \{\}\s*"
              r"try \{ opqibi = await pdf\.embedJpg\(dataUriBase64\(REPORT_OPQIBI\)\); \} catch \{\}",
              re.S,
          )
          s, n = embed_pattern.subn(
              "\n  let mark = null;\n  try { mark = await pdf.embedJpg(dataUriBase64(REPORT_MARK)); } catch {}",
              s,
              count=1,
          )
          if n != 1 and "let mark = null;" not in s:
              raise SystemExit('PDF image embed block not found')

          # HTML owns page 1 completely; never erase and repaint it with pdf-lib.
          cover_pattern = re.compile(
              r"    if \(index === 0\) \{.*?\n    \}\n\n    const left = 50;",
              re.S,
          )
          s, n = cover_pattern.subn("    if (index === 0) return;\n\n    const left = 50;", s, count=1)
          if n != 1 and "if (index === 0) return;" not in s:
              raise SystemExit('first-page repaint block not found')

          # Interior pages use the real standalone spiral, never a masked full logo.
          interior_pattern = re.compile(
              r"    // Use the exact spiral from the original full logo:.*?\n\s*const running =",
              re.S,
          )
          exact_mark = """    // Exact standalone multicolour spiral from the validated Word artwork.
              if (mark) {
                const box = fit(mark, mm(9), mm(9));
                page.drawImage(mark, {
                  x: left,
                  y: height - mm(16),
                  width: box.width,
                  height: box.height,
                });
              }

              const running ="""
          s, n = interior_pattern.subn(exact_mark, s, count=1)
          if n != 1 and "Exact standalone multicolour spiral" not in s:
              raise SystemExit('interior logo crop block not found')

          # Guardrails: no duplicate cover painter and no logo masking remains.
          if 'page.drawRectangle({ x: 0, y: 0, width, height: bannerBottom' in s:
              raise SystemExit('duplicate cover painter still present')
          if 'mask its wordmark' in s:
              raise SystemExit('masked-logo workaround still present')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify exact asset declarations and syntax
        run: |
          grep -q "export const REPORT_LOGO" reportBrandAssets.js
          grep -q "export const REPORT_MARK" reportBrandAssets.js
          grep -q "export const REPORT_COVER" reportBrandAssets.js
          grep -q "export const REPORT_OPQIBI" reportBrandAssets.js
          node --check reportBuilder.js
          node --check reportBrandAssets.js

      - name: Remove one-shot workflow and commit repair
        run: |
          git rm .github/workflows/apply-pdf-brand-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reportBuilder.js reportBrandAssets.js
          git commit -m "fix: restore validated Word PDF branding"
          git push origin HEAD:fix/pdf-report-word-layout
