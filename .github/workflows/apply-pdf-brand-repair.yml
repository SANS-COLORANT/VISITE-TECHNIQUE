name: Scan Git history for exact PDF assets

on:
  push:
    branches:
      - fix/pdf-report-word-layout
    paths:
      - .github/workflows/apply-pdf-brand-repair.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all refs
        uses: actions/checkout@v4
        with:
          ref: fix/pdf-report-word-layout
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch every branch and scan every blob
        shell: bash
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force
          python - <<'PY'
          import hashlib
          import subprocess

          expected = {
              'REPORT_LOGO.jpg': '60cea6a784218ca021fda4669976a6a82e23615f11066c55dae4ea04829a52dd',
              'REPORT_COVER.jpg': 'd03c6bd7ee55c4195d8910a1942d88ec90b0f399a860969f29c1500813329929',
              'REPORT_MARK_FULL.jpg': '9b30f9ec2a370da11acd97111fc1da15f521c2bcc37c5268a99c90c9bc8c3567',
              'REPORT_OPQIBI.jpg': '135f71e5a2b4b85001e2ae51b0164de59271a3ef6a74d02e2c45be7576bb7d1b',
          }
          wanted = {v:k for k,v in expected.items()}
          found = {}
          listing = subprocess.check_output(['git','rev-list','--objects','--all'], text=True, errors='replace')
          seen = set()
          for line in listing.splitlines():
              if not line.strip():
                  continue
              parts = line.split(' ', 1)
              oid = parts[0]
              if oid in seen:
                  continue
              seen.add(oid)
              typ = subprocess.check_output(['git','cat-file','-t',oid], text=True).strip()
              if typ != 'blob':
                  continue
              size = int(subprocess.check_output(['git','cat-file','-s',oid], text=True).strip())
              if size < 1000 or size > 400000:
                  continue
              data = subprocess.check_output(['git','cat-file','blob',oid])
              digest = hashlib.sha256(data).hexdigest()
              if digest in wanted:
                  name = wanted[digest]
                  path = parts[1] if len(parts) > 1 else '(no path)'
                  found[name] = (oid, path, size)
                  print(f'FOUND {name} blob={oid} size={size} path={path} sha256={digest}')
          for name, digest in expected.items():
              if name not in found:
                  print(f'MISSING {name} sha256={digest}')
          print(f'FOUND_COUNT={len(found)}/{len(expected)}')
          PY
