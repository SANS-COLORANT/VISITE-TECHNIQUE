name: Remove corrupt PDF image embedding

on:
  push:
    branches:
      - fix/pdf-report-word-layout
    paths:
      - .github/workflows/apply-pdf-brand-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-corrupt-embedding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/pdf-report-word-layout

      - name: Remove damaged image streams from pdf-lib layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('reportBuilder.js')
          s = p.read_text(encoding='utf-8')

          # The cover is rendered by HTML. The pdf-lib pass must only add textual
          # running header/footer until the exact standalone assets are installed.
          s, n = re.subn(
              r"\n  let logo = null;\n  let cover = null;\n  let opqibi = null;\n  try \{ logo = await pdf\.embedJpg\(dataUriBase64\(REPORT_LOGO\)\); \} catch \{\}\n  try \{ cover = await pdf\.embedJpg\(dataUriBase64\(REPORT_COVER\)\); \} catch \{\}\n  try \{ opqibi = await pdf\.embedJpg\(dataUriBase64\(REPORT_OPQIBI\)\); \} catch \{\}\n",
              "\n",
              s,
              count=1,
          )
          if n != 1 and 'embedJpg(dataUriBase64(REPORT_' in s:
              raise SystemExit('corrupt pdf-lib image embed block not removed')

          s, n = re.subn(
              r"\n    // Use the exact spiral from the original full logo:.*?\n    \}\n\n    const running =",
              "\n    // Branding image intentionally omitted here until the exact standalone mark is installed.\n\n    const running =",
              s,
              count=1,
              flags=re.S,
          )
          if n != 1 and 'mask its wordmark' in s:
              raise SystemExit('masked full-logo workaround not removed')

          # Remove helper if it became unused.
          if 'dataUriBase64(' not in s[s.find('function dataUriBase64') + 1:]:
              s = re.sub(r"\nfunction dataUriBase64\(dataUri\) \{\n  return String\(dataUri \|\| ''\)\.split\(','\)\[1\] \|\| '';\n\}\n", "\n", s, count=1)

          forbidden = [
              'embedJpg(dataUriBase64(REPORT_',
              'mask its wordmark',
              'page.drawImage(logo',
          ]
          for token in forbidden:
              if token in s:
                  raise SystemExit(f'forbidden damaged-image path remains: {token}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        run: |
          node --check reportBuilder.js
          grep -q "if (index === 0) return;" reportBuilder.js
          ! grep -q "embedJpg(dataUriBase64(REPORT_" reportBuilder.js
          ! grep -q "mask its wordmark" reportBuilder.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reportBuilder.js
          git commit -m "fix: remove corrupt PDF image streams"
          git push origin HEAD:fix/pdf-report-word-layout
