name: Finalize exact PDF branding

on:
  push:
    branches:
      - fix/pdf-report-word-layout
    paths:
      - .github/workflows/apply-pdf-brand-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-pdf-branding:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          ref: fix/pdf-report-word-layout
          fetch-depth: 0

      - name: Verify exact shared image payloads
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re

          def payload(path):
              text = Path(path).read_text(encoding='utf-8')
              m = re.search(r"export default ['\"]([^'\"]+)['\"]", text, re.S)
              if not m:
                  raise SystemExit(f'No payload in {path}')
              # Historical staging chunks can contain harmless whitespace/control
              # characters introduced while splitting very long strings. Keep only
              # the Base64 alphabet; the image bytes themselves remain untouched.
              return re.sub(r'[^A-Za-z0-9+/=]', '', m.group(1))

          def decode_parts(paths):
              parts = [payload(p) for p in paths]
              # Chunks are pieces of one Base64 stream, not independently encoded
              # files. Padding is valid only at the very end of the assembled stream.
              raw = ''.join(part.rstrip('=') if i < len(parts) - 1 else part
                            for i, part in enumerate(parts))
              raw += '=' * ((4 - len(raw) % 4) % 4)
              try:
                  data = base64.b64decode(raw, validate=True)
              except Exception as exc:
                  raise SystemExit(f'Invalid Base64 in {paths}: {exc}')
              if not (data.startswith(b'\xff\xd8') and data.endswith(b'\xff\xd9')):
                  raise SystemExit(f'Invalid JPEG framing for {paths}: bytes={len(data)}')
              return raw, data

          expected = {
              'logo': '60cea6a784218ca021fda4669976a6a82e23615f11066c55dae4ea04829a52dd',
              'cover': 'd03c6bd7ee55c4195d8910a1942d88ec90b0f399a860969f29c1500813329929',
              'mark': '9b30f9ec2a370da11acd97111fc1da15f521c2bcc37c5268a99c90c9bc8c3567',
          }

          assets = {
              'logo': decode_parts(['reportAssetsExactV2/logo0.js', 'reportAssetsExactV2/logo1.js', 'reportAssetsExactV2/logo2.js']),
              'cover': decode_parts(['reportAssetsExactV2/cover0.js', 'reportAssetsExactV2/cover1.js', 'reportAssetsExactV2/cover2.js']),
              'mark': decode_parts(['reportAssetsExact/mark.js']),
              'opqibi': decode_parts(['reportAssetsExact/opqibi.js']),
          }

          for name, (_, data) in assets.items():
              digest = hashlib.sha256(data).hexdigest()
              print(f'{name}: bytes={len(data)} sha256={digest}')
              if name in expected and digest != expected[name]:
                  raise SystemExit(f'{name} does not match the shared reference image: {digest}')

          # Persist normalized streams for the next step so the app never imports
          # malformed historical chunk text.
          out = Path('/tmp/pdf-assets')
          out.mkdir(exist_ok=True)
          for name, (raw, data) in assets.items():
              (out / f'{name}.b64').write_text(raw, encoding='ascii')
              (out / f'{name}.jpg').write_bytes(data)
          PY
          file /tmp/pdf-assets/*.jpg

      - name: Use verified assets without recompression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          def b64(name):
              return Path(f'/tmp/pdf-assets/{name}.b64').read_text(encoding='ascii')
          content = """// Report visuals verified against the user's reference documents.
          // They are embedded without resizing, redrawing or recompression.
          const JPEG_DATA_URI = 'data:image/jpeg;base64,';

          export const REPORT_LOGO = JPEG_DATA_URI + '__LOGO__';
          export const REPORT_COVER = JPEG_DATA_URI + '__COVER__';
          export const REPORT_MARK = JPEG_DATA_URI + '__MARK__';
          export const REPORT_OPQIBI = JPEG_DATA_URI + '__OPQIBI__';
          """.replace('__LOGO__', b64('logo')).replace('__COVER__', b64('cover')).replace('__MARK__', b64('mark')).replace('__OPQIBI__', b64('opqibi'))
          Path('reportBrandAssets.js').write_text(content, encoding='utf-8')
          PY

      - name: Enforce one PDF header and the exact spiral
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('reportBuilder.js')
          s = p.read_text(encoding='utf-8')

          old_import = "import { REPORT_COVER, REPORT_LOGO, REPORT_OPQIBI } from './reportBrandAssets.js';"
          new_import = "import { REPORT_COVER, REPORT_LOGO, REPORT_MARK, REPORT_OPQIBI } from './reportBrandAssets.js';"
          if old_import in s:
              s = s.replace(old_import, new_import, 1)
          elif new_import not in s:
              raise SystemExit('report asset import not found')

          logo_fn = """function logoHtml(classe = 'reportLogo') {
            return `<img class=\"${classe}\" src=\"${REPORT_LOGO}\" alt=\"Energie & Service\"/>`;
          }
          """
          mark_fn = """function logoHtml(classe = 'reportLogo') {
            return `<img class=\"${classe}\" src=\"${REPORT_LOGO}\" alt=\"Energie & Service\"/>`;
          }

          function markHtml(classe = 'reportMark') {
            return `<img class=\"${classe}\" src=\"${REPORT_MARK}\" alt=\"Energie & Service\"/>`;
          }
          """
          if logo_fn in s:
              s = s.replace(logo_fn, mark_fn, 1)
          elif "function markHtml(classe = 'reportMark')" not in s:
              raise SystemExit('logoHtml block not found')

          s = s.replace("${logoHtml('tocLogo')}", "${markHtml('tocMark')}")
          s = s.replace("${logoHtml('interiorLogo')}", "${markHtml('interiorMark')}")

          old_word = ".interiorHeader{display:block}.interiorFooter{display:flex}"
          new_word = ".interiorHeader{display:block}.interiorFooter{display:flex}.tocBrand{display:flex}"
          if old_word in s:
              s = s.replace(old_word, new_word, 1)

          old_pdf = ".interiorHeader,.interiorFooter{display:none}"
          new_pdf = ".interiorHeader,.interiorFooter,.tocBrand{display:none}"
          if old_pdf in s:
              s = s.replace(old_pdf, new_pdf, 1)
          elif new_pdf not in s:
              raise SystemExit('PDF fixed UI rule not found')

          marker = "  const bold = await pdf.embedFont(StandardFonts.HelveticaBold);\n"
          embed = """  const bold = await pdf.embedFont(StandardFonts.HelveticaBold);
          let reportMark = null;
          try {
            reportMark = await pdf.embedJpg(dataUriBase64(REPORT_MARK));
          } catch (error) {
            throw new Error(`Impossible d'intégrer la spirale officielle au PDF: ${error?.message || error}`);
          }
          """
          if marker in s and 'let reportMark = null;' not in s:
              s = s.replace(marker, embed, 1)

          old_omitted = "    // Branding image intentionally omitted here until the exact standalone mark is installed.\n"
          draw_mark = """    // Exact standalone spiral from the reference Word document.
            const markBox = fit(reportMark, mm(9), mm(9));
            page.drawImage(reportMark, {
              x: mm(5.5),
              y: height - mm(14.5),
              width: markBox.width,
              height: markBox.height,
            });
          """
          if old_omitted in s:
              s = s.replace(old_omitted, draw_mark, 1)
          elif 'const markBox = fit(reportMark' not in s:
              raise SystemExit('interior branding insertion point not found')

          required = [
              'if (index === 0) return;',
              'let reportMark = null;',
              'page.drawImage(reportMark',
              '.interiorHeader,.interiorFooter,.tocBrand{display:none}',
          ]
          for token in required:
              if token not in s:
                  raise SystemExit(f'missing PDF guardrail: {token}')

          forbidden = ['page.drawImage(logo', 'mask its wordmark', 'Branding image intentionally omitted']
          for token in forbidden:
              if token in s:
                  raise SystemExit(f'old branding workaround remains: {token}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript and final asset wiring
        shell: bash
        run: |
          node --check reportBuilder.js
          node --check reportBrandAssets.js
          grep -q "REPORT_MARK" reportBuilder.js
          grep -q "if (index === 0) return;" reportBuilder.js
          grep -q "page.drawImage(reportMark" reportBuilder.js
          grep -q "interiorFooter,.tocBrand{display:none}" reportBuilder.js
          ! grep -q "page.drawImage(logo" reportBuilder.js
          ! grep -q "mask its wordmark" reportBuilder.js

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-pdf-brand-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reportBuilder.js reportBrandAssets.js
          git commit -m "fix: use exact report images and single PDF header"
          git push origin HEAD:fix/pdf-report-word-layout
