name: Apply PDF structural repair

on:
  push:
    branches:
      - fix/pdf-report-word-layout
    paths:
      - .github/workflows/apply-pdf-brand-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-pdf-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/pdf-report-word-layout

      - name: Remove duplicate cover painter and broken CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('reportBuilder.js')
          s = p.read_text(encoding='utf-8')

          bad_css = ".coverClient{position:absolute;left:12mm;right:12mm;top:49mm;height:20mm;background:${ORANGE};color:#fff;border-radius:5mm;text-align:center;padding:0;font-size:18pt;font-weight:700;z-index:3;display:flex;align-items:center;justify-content:center};color:#fff;border-radius:6mm;text-align:center;padding:8mm 6mm;font-size:23pt;font-weight:700;z-index:3}"
          good_css = ".coverClient{position:absolute;left:12mm;right:12mm;top:49mm;height:20mm;background:${ORANGE};color:#fff;border-radius:5mm;text-align:center;padding:0;font-size:18pt;font-weight:700;z-index:3;display:flex;align-items:center;justify-content:center}"
          if bad_css in s:
              s = s.replace(bad_css, good_css, 1)
          if '};color:#fff;border-radius:6mm;text-align:center;padding:8mm 6mm' in s:
              raise SystemExit('broken coverClient CSS still present')

          # Page 1 is already fully rendered by Expo Print from HTML.
          # Never erase and repaint it with pdf-lib: that created the duplicate/corrupt cover.
          cover_pattern = re.compile(
              r"    if \(index === 0\) \{.*?\n      return;\n    \}\n\n    const left = 50;",
              re.S,
          )
          s, count = cover_pattern.subn(
              "    // The HTML renderer owns the complete cover. Do not repaint page 1.\n    if (index === 0) return;\n\n    const left = 50;",
              s,
              count=1,
          )
          if count != 1 and 'if (index === 0) return;' not in s:
              raise SystemExit('duplicate cover painter block not found')

          forbidden = [
              'const bannerBottom = height - mm(82)',
              'page.drawRectangle({ x: 0, y: 0, width, height: bannerBottom',
              "const dateText = `VERSAILLES, LE",
          ]
          for token in forbidden:
              if token in s:
                  raise SystemExit(f'duplicate cover code still present: {token}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check reportBuilder.js
          node --check reportBrandAssets.js
          grep -q "if (index === 0) return;" reportBuilder.js
          ! grep -q "bannerBottom" reportBuilder.js

      - name: Commit structural repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reportBuilder.js
          git commit -m "fix: stop repainting PDF cover"
          git push origin HEAD:fix/pdf-report-word-layout
