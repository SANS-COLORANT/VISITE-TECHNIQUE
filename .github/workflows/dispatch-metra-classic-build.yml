name: Dispatch METRA Classic Build

on:
  push:
    branches:
      - feat/metra-classic-refresh
    paths:
      - '.github/workflows/dispatch-metra-classic-build.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Launch Native Android APK build on current feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          TARGET_REF: feat/metra-classic-refresh
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/actions/workflows/native-android-apk.yml/dispatches" \
            -d "{\"ref\":\"${TARGET_REF}\"}"
          echo "Build Android demandé sur ${TARGET_REF}."
