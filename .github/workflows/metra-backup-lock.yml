name: METRA backup dependency lock verification
on:
  push:
    branches:
      - fix/metra-play-secure-backup-restore-20261123
    paths:
      - '.github/workflows/metra-backup-lock.yml'
      - 'package.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve exact native ZIP version into reproducible lock metadata
        run: |
          npm install --package-lock-only --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          node -e "const j=require('./package-lock.json'); console.log('METRA_ZIP_LOCK_ENTRY '+JSON.stringify({root:j.packages[''].dependencies['react-native-zip-archive'],entry:j.packages['node_modules/react-native-zip-archive']}))"
          npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Archive lockfile for follow-up review
        uses: actions/upload-artifact@v4
        with:
          name: METRA-ZIP-LOCKFILE-9-5-3
          path: package-lock.json
          retention-days: 7
