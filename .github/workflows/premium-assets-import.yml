name: Import verified premium media

on:
  push:
    branches:
      - work/premium-home-asset-integrity
    paths:
      - METRA_ASSETS_VALIDES.zip

permissions:
  contents: write

concurrency:
  group: import-premium-media-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/work/premium-home-asset-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact uploaded revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install audit-only image decoder
        run: python -m pip install --disable-pip-version-check 'Pillow==12.3.0'

      - name: Import only the reviewed ZIP and validate every pixel
        run: python .github/scripts/import_approved_premium_assets.py --archive METRA_ASSETS_VALIDES.zip

      - name: Validate scene structure and pixel provenance
        run: |
          node .github/scripts/validate_premium_home_scene.js
          python .github/scripts/validate_premium_home_images.py --require-provenance --output /tmp/premium-media-audit

      - name: Run existing model and image regression tests
        run: |
          node --test .github/scripts/test_premium_home_model.js
          python .github/scripts/test_premium_home_images.py -v

      - name: Commit only verified media to the working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- visual-packs/spiral-active/home-scene visual-packs/spiral-active/manifest.json visual-packs/spiral-active/startup-media
          git rm -- METRA_ASSETS_VALIDES.zip
          git commit -m 'fix(assets): import verified building originals and stage velvet intro'
          git push origin HEAD:refs/heads/work/premium-home-asset-integrity
          {
            echo '## Verified media imported'
            echo 'Four building layers and their manifest/provenance are committed to the working branch.'
            echo 'All 147 frames of the velvet intro were verified; the native player is NOT enabled yet.'
            echo 'No APK or release was produced. PR #81 remains a draft pending native visual acceptance.'
            echo "Commit: $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
