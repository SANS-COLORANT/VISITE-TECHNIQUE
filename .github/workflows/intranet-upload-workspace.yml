name: Intranet upload workspace export
on:
  push:
    branches: [feat/intranet-visit-upload]
    paths: [.github/workflows/intranet-upload-workspace.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export committed source
        run: git archive --format=tar.gz -o /tmp/metra-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: metra-source
          path: /tmp/metra-source.tar.gz
          retention-days: 1
          compression-level: 0
