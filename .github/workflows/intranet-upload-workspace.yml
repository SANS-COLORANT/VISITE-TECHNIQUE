name: Intranet upload workspace publish
on:
  push:
    branches: [feat/intranet-visit-upload]
    paths: [.github/workflows/intranet-upload-workspace.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild reviewed patch from repository chunks
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent-upload-parts/intranet-runtime.patch.gz.b64.part* | tr -d ' \n\r\t' > /tmp/metra.patch.gz.b64
          base64 -d /tmp/metra.patch.gz.b64 | gzip -dc > /tmp/metra.patch
          git apply --check /tmp/metra.patch
          git apply /tmp/metra.patch
          git diff --check
      - name: Verify METRA runtime before publishing
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:metra
      - name: Commit source changes and clean temporary publisher files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/agent-upload-parts .github/workflows/intranet-upload-workspace.yml
          git config user.name "METRA GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "feat: envoyer les visites METRA vers l Intranet"
          git push origin HEAD:feat/intranet-visit-upload
