name: Temporary client-bound visit list patch

on:
  push:
    branches: [fix/intranet-client-bound-status]
    paths: [.github/workflows/patch-client-bound-visit-list.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/intranet-client-bound-status
          fetch-depth: 0
      - name: Apply exact UI patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('SiteVisitesScreen.js')
          s = p.read_text(encoding='utf-8')

          old = "import { exporterVisitesExcelEnLot } from './batchExcel.js';\n"
          new = old + "import { IntranetVisitSyncControl } from './IntranetVisitSync.js';\n"
          if old not in s:
              raise SystemExit('import anchor not found')
          if "import { IntranetVisitSyncControl }" not in s:
              s = s.replace(old, new, 1)

          old = "  const [exportLotEnCours, setExportLotEnCours] = useState(false);\n"
          new = old + "  const [intranetClientImported, setIntranetClientImported] = useState(false);\n"
          if old not in s:
              raise SystemExit('state anchor not found')
          if 'setIntranetClientImported' not in s:
              s = s.replace(old, new, 1)

          old = "    setVisites(v);\n    setSite(s);\n    if (s) {\n"
          new = "    setVisites(v);\n    setSite(s);\n    const database = await getDb();\n    const importedClient = s?.client_id ? await database.getFirstAsync(`SELECT remote_client_id FROM api_client_links WHERE local_client_id=? LIMIT 1`, [s.client_id]) : null;\n    setIntranetClientImported(Boolean(importedClient?.remote_client_id));\n    if (s) {\n"
          if old not in s:
              raise SystemExit('loader anchor not found')
          s = s.replace(old, new, 1)

          old = """              <View style={{ alignItems: 'flex-end', gap: 4 }}>
                <View style={styles.badge}><Text style={styles.badgeText}>{STATUT_LABELS[item.statut] || item.statut} · {item.progression_pct}%</Text></View>
                {item.api_remote_local_id ? <Text style={{ color: Number(item.api_is_historical) === 1 || item.intranet_sync_status === 'synced' ? '#16794B' : ['conflict','validation_error','rejected','auth_error'].includes(item.intranet_sync_status) ? '#B42318' : COLORS.muted, fontSize: 10.5, fontWeight: '800' }}>{Number(item.api_is_historical) === 1 ? '↙ Intranet · historique' : item.intranet_sync_status === 'synced' ? `✓ Intranet${item.intranet_remote_visit_id ? ` · n°${item.intranet_remote_visit_id}` : ''}` : item.intranet_sync_status ? '☁ Intranet · à suivre' : '☁ Intranet · non envoyée'}</Text> : null}
              </View>
"""
          new = """              <View style={{ alignItems: 'flex-end', gap: 5 }}>
                <View style={styles.badge}><Text style={styles.badgeText}>{STATUT_LABELS[item.statut] || item.statut} · {item.progression_pct}%</Text></View>
                {intranetClientImported || item.api_remote_local_id ? <IntranetVisitSyncControl visite={item} onVisitChanged={charger} compact /> : null}
              </View>
"""
          if old not in s:
              raise SystemExit('visit status anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check SiteVisitesScreen.js
          git diff --check
      - name: Commit product patch
        shell: bash
        run: |
          git config user.name "SANS-COLORANT"
          git config user.email "154561309+SANS-COLORANT@users.noreply.github.com"
          git add SiteVisitesScreen.js
          git diff --cached --quiet && exit 0
          git commit -m "ui: show Offline Online status on visit cards"
          git push origin HEAD:fix/intranet-client-bound-status
