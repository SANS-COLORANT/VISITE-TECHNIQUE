name: Apply deterministic PDF cover images

on:
  push:
    branches:
      - fix/pdf-report-word-layout
    paths:
      - .github/workflows/apply-pdf-cover-overlay.yml

permissions:
  contents: write

jobs:
  apply-pdf-cover-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PDF branch
        uses: actions/checkout@v4
        with:
          ref: fix/pdf-report-word-layout
          fetch-depth: 0

      - name: Patch PDF image rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('reportBuilder.js')
          source = path.read_text(encoding='utf-8')

          old_import = "import { REPORT_COVER, REPORT_LOGO, REPORT_OPQIBI } from './reportBrandAssets.js';"
          new_import = old_import + "\nimport REPORT_MARK_B64 from './reportAssetsExact/mark.js';"
          if old_import not in source:
              raise SystemExit('reportBuilder import marker not found')
          source = source.replace(old_import, new_import, 1)

          old_assets = """  const orange = rgb(0.94, 0.45, 0.05);\n\n  const fit = (image, maxWidth, maxHeight) => {"""
          new_assets = """  const orange = rgb(0.94, 0.45, 0.05);\n\n  // Expo/Android can partially decode or crop large data-URI images when HTML is\n  // printed to PDF. Embed the same Word assets directly in the finished PDF so\n  // their rendering no longer depends on the WebView/print engine.\n  const embedJpgSafe = async (base64) => {\n    try { return base64 ? await pdf.embedJpg(base64) : null; } catch { return null; }\n  };\n  const coverLogoImage = await embedJpgSafe(dataUriBase64(REPORT_LOGO));\n  const coverVisualImage = await embedJpgSafe(dataUriBase64(REPORT_COVER));\n  const coverOpqibiImage = await embedJpgSafe(dataUriBase64(REPORT_OPQIBI));\n  const pageMarkImage = await embedJpgSafe(REPORT_MARK_B64);\n\n  const fit = (image, maxWidth, maxHeight) => {"""
          if old_assets not in source:
              raise SystemExit('habillerPdf asset marker not found')
          source = source.replace(old_assets, new_assets, 1)

          old_cover = """    // The HTML renderer owns the complete cover. Do not repaint page 1.\n    if (index === 0) return;"""
          new_cover = """    if (index === 0) {\n      // Clear only the fragile HTML-image zones. Text, orange client banner and\n      // the corporate footer generated by HTML remain untouched.\n      page.drawRectangle({ x: mm(5), y: height - mm(31), width: mm(82), height: mm(26), color: white });\n      page.drawRectangle({ x: mm(23), y: height - mm(184), width: mm(164), height: mm(94), color: white });\n      page.drawRectangle({ x: mm(16), y: mm(7), width: mm(20), height: mm(12), color: white });\n\n      // Full Energie & Service logo — same asset as the Word template.\n      if (coverLogoImage) {\n        const s = fit(coverLogoImage, mm(72), mm(20));\n        page.drawImage(coverLogoImage, {\n          x: mm(7),\n          y: height - mm(6) - s.height,\n          width: s.width,\n          height: s.height,\n        });\n      }\n\n      // Main cover photograph — preserve its aspect ratio instead of relying on\n      // CSS object-fit, which is the failing path on Android PDF printing.\n      if (coverVisualImage) {\n        const s = fit(coverVisualImage, mm(140), mm(89));\n        page.drawImage(coverVisualImage, {\n          x: mm(25),\n          y: height - mm(94) - s.height,\n          width: s.width,\n          height: s.height,\n        });\n      }\n\n      // OPQIBI certification mark at the lower-left of the legal line.\n      if (coverOpqibiImage) {\n        const s = fit(coverOpqibiImage, mm(18), mm(9));\n        page.drawImage(coverOpqibiImage, {\n          x: mm(18),\n          y: mm(9),\n          width: s.width,\n          height: s.height,\n        });\n      }\n      return;\n    }"""
          if old_cover not in source:
              raise SystemExit('cover skip marker not found')
          source = source.replace(old_cover, new_cover, 1)

          old_mark = """    // Branding image intentionally omitted here until the exact standalone mark is installed."""
          new_mark = """    // Small standalone spiral from the Word template on every interior page.\n    if (pageMarkImage) {\n      const s = fit(pageMarkImage, mm(6), mm(6));\n      page.drawImage(pageMarkImage, {\n        x: mm(4.5),\n        y: height - mm(4.5) - s.height,\n        width: s.width,\n        height: s.height,\n      });\n    }"""
          if old_mark not in source:
              raise SystemExit('interior branding marker not found')
          source = source.replace(old_mark, new_mark, 1)

          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate JavaScript
        run: |
          node --check reportBuilder.js
          grep -q "coverVisualImage" reportBuilder.js
          grep -q "REPORT_MARK_B64" reportBuilder.js

      - name: Commit PDF image fix
        shell: bash
        run: |
          rm .github/workflows/apply-pdf-cover-overlay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: render Word images directly in PDF"
          git push origin HEAD:fix/pdf-report-word-layout
