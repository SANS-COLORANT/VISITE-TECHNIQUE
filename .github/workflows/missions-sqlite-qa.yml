name: Missions SQLite QA

on:
  push:
    branches:
      - feat/metra-missions-lab
    paths:
      - 'database/constants.js'
      - 'database/migrations/**'
      - 'missionsDb.js'
      - 'missionVisitDb.js'
      - 'missionExcelExport.js'
      - 'Mission*.js'
      - 'Missions*.js'
      - 'App.js'
      - 'HomeScreen.js'
      - 'featureSettings.js'
      - 'LabMetraPanel.js'
      - '.github/scripts/**'
      - '.github/workflows/missions-sqlite-qa.yml'
  pull_request:
    paths:
      - 'database/constants.js'
      - 'database/migrations/**'
      - 'missionsDb.js'
      - 'missionVisitDb.js'
      - 'missionExcelExport.js'
      - 'Mission*.js'
      - 'Missions*.js'
      - 'App.js'
      - 'HomeScreen.js'
      - 'featureSettings.js'
      - 'LabMetraPanel.js'
      - '.github/scripts/**'
      - '.github/workflows/missions-sqlite-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate all committed METRA runtime contracts
        run: node .github/scripts/run_source_patches.js

      - name: Validate Missions source contract
        run: node .github/scripts/check_missions_lab_contract.js

      - name: Execute SQLite v40 compatibility tests
        run: python .github/scripts/test_missions_sqlite_compat.py

      - name: Confirm schema lineage
        run: |
          grep -q "DATABASE_SCHEMA_VERSION = 40" database/constants.js
          grep -q "migration039, migration040" database/migrations/index.js
