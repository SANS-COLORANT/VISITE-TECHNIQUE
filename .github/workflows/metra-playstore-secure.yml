name: METRA Android 16 - Play Store secure build
run-name: METRA Play candidate #${{ github.run_number }}

on:
  push:
    branches:
      - release/metra-playstore-secure-20261120
      - fix/play-astra-security-m01-m07-20261120
      - fix/play-astra-m04-m05-20261120
      - fix/astra20-intranet-reliability-20261120
      - fix/astra24-photo-queue-classification-20261120
      - fix/astra26-stream-historical-photos-20261120
      - fix/astra27-reject-partial-photo-http-20261120
      - fix/metra-launch-safe-area-20261123
      - fix/metra-settings-modal-recovery-20261123
      - fix/metra-equipment-flatlist-legacy-20261123
      - audit/metra-all-screen-blockers-20261123
      - fix/metra-play-backup-ux-stable-20261123
      - fix/metra-play-secure-backup-restore-20261123
      - fix/metra-restore-recovery-release-20261124
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metra-play-secure-${{ github.ref }}
  cancel-in-progress: false

jobs:
  secure-android:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      METRA_PLAY_SECURE_BUILD: '1'
      GOOGLE_MAPS_API_KEY: ''
      npm_config_legacy_peer_deps: 'true'
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -Dorg.gradle.workers.max=2'

    steps:
      - name: Checkout dedicated release branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check source for embedded credentials and insecure Android defaults
        run: python3 .github/scripts/verify_play_security.py

      - name: Upgrade Expo to API36-capable SDK 54 and resolve compatible dependencies
        if: github.ref_name != 'fix/metra-restore-recovery-release-20261124'
        run: |
          set -euo pipefail
          npm install --save expo@~54.0.38 react@19.1.0 react-native@0.81.5 --ignore-scripts --no-audit --no-fund
          npx expo install --fix --npm
          python3 .github/scripts/migrate_expo_54_legacy_filesystem.py
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund --prefer-offline
          npx expo install --check
          node -e "const p=require('./package.json'); if(!p.dependencies.expo.startsWith('~54.')) process.exit(1)"
          node --check app.config.js

      - name: Install exact committed dependencies for restoration candidate
        if: github.ref_name == 'fix/metra-restore-recovery-release-20261124'
        run: |
          npm ci --no-audit --no-fund --prefer-offline
          npx expo install --check
          git diff --exit-code -- package.json package-lock.json

      - name: Check JS syntax, SQLite model, REMAR and local reports
        run: |
          npm run verify:metra
          node --test .github/scripts/test_metra_settings_safe_area.cjs
          node --test .github/scripts/test_metra_play_backup_ui.cjs
          node --test .github/scripts/test_metra_equipment_legacy.cjs
          node --test .github/scripts/test_photo_ocr_gallery_contract.cjs
          node .github/scripts/audit_metra_all_screens.cjs
          # Fail the release when the vulnerable npm-registry SheetJS is bundled.
          node .github/scripts/assert_sheetjs_secure.cjs
          # Node ESM cannot resolve the Expo SDK54 legacy directory import; Metro
          # resolves it correctly. Keep executable REMAR/SQLite contract tests.
          node .github/scripts/test_remar_141_intranet_matrix.js
          node .github/scripts/test_remar_dynamic.js
          node --import ./.github/scripts/legacy_fs_resolver.mjs --experimental-test-module-mocks --test tests/trameRemar.test.mjs
          node tests/reportPdfFragments.test.mjs
          node --check symfonyApi.js
          python3 .github/scripts/verify_intranet_transport_source.py
          python3 .github/scripts/verify_astra20_response_contract.py
          node .github/scripts/test_astra24_photo_error_contract.cjs
          node .github/scripts/test_astra26_historical_download.cjs
          node --check databaseBackup.js
          node --check supportDump.js
          node --check plugins/withMetraPlaySecurity.js

      - name: Commit resolved dependency lock and legacy FS migration as real source
        if: github.ref_name != 'fix/metra-restore-recovery-release-20261124'
        run: |
          set -euo pipefail
          git add package.json package-lock.json
          git diff --name-only -z -- '*.js' '*.jsx' '*.ts' '*.tsx' > "$RUNNER_TEMP/metra-changed-source-files"
          while IFS= read -r -d '' file; do
            case "$file" in
              appVersion.js|googleMapsRuntime.generated.js|playSecurityRuntime.generated.js) ;;
              *) git add -- "$file" ;;
            esac
          done < "$RUNNER_TEMP/metra-changed-source-files"
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build: version Expo 54 compatibility and legacy file-system migration'
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Audit exact restoration runtime before compiling
        if: github.ref_name == 'fix/metra-restore-recovery-release-20261124'
        run: |
          node --test tests/backupPlaySecure.test.mjs tests/restoreRecovery.test.mjs tests/mobileLayout.test.mjs tests/reportPdfFragments.test.mjs tests/reportPerformance.test.mjs tests/reportFidelity.test.mjs
          grep -qx 'export const METRA_PLAY_SECURE_BUILD = true;' playSecurityRuntime.generated.js
          node .github/scripts/metra_full_audit_runner.cjs --generated-play
          git diff --exit-code -- '*.js' '*.jsx' '*.ts' '*.tsx' package.json package-lock.json ':!playSecurityRuntime.generated.js' ':!googleMapsRuntime.generated.js'
      - name: Preserve source audit evidence
        if: always() && github.ref_name == 'fix/metra-restore-recovery-release-20261124'
        uses: actions/upload-artifact@v4
        with:
          name: METRA-RESTORE-SOURCE-AUDIT-${{ github.run_number }}
          path: audit-results/
          if-no-files-found: warn

      - name: Stamp version code without committing deployment-specific changes
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, time, os
          p=Path('app.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data['expo']['android']['package']=='com.visitetechnique.tablet'
          data['expo']['android']['versionCode']=int(time.time())
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          v=Path('appVersion.js')
          v.write_text(v.read_text().replace("APK_BUILD = 'DEV'","APK_BUILD = '"+os.environ['BUILD_NUMBER']+"'"))
          PY

      - name: Validate Android JavaScript bundle and native config
        run: |
          set -euo pipefail
          npx expo export --platform android --output-dir dist-play-ci
          test -f playSecurityRuntime.generated.js
          grep -qx 'export const METRA_PLAY_SECURE_BUILD = true;' playSecurityRuntime.generated.js
          npx expo prebuild --clean --platform android --no-install
          test -s android/gradlew
          test -s android/app/src/main/java/com/metra/dpop/MetraDpopModule.kt
          grep -q 'followRedirects(false)' android/app/src/main/java/com/metra/dpop/MetraDpopModule.kt
          grep -q 'followSslRedirects(false)' android/app/src/main/java/com/metra/dpop/MetraDpopModule.kt
          python3 .github/scripts/verify_play_cropper_manifest.py
          grep -q 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          test -s android/app/src/main/res/xml/metra_data_extraction_rules.xml

      - name: Build native QA APK (historical debug signing, NOT Play production)
        env:
          METRA_RELEASE_STORE_PASSWORD: android
          METRA_RELEASE_KEY_ALIAS: androiddebugkey
          METRA_RELEASE_KEY_PASSWORD: android
        run: |
          set -euo pipefail
          cp android/app/debug.keystore android/app/metra-release.keystore
          python3 .github/scripts/configure_android_release_signing.py
          cd android
          ./gradlew assembleRelease --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
          cd ..
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/METRA-API36-QA.apk
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$tools/apksigner" verify --verbose release/METRA-API36-QA.apk
          "$tools/aapt" dump badging release/METRA-API36-QA.apk | grep -E "package:|targetSdkVersion"
          "$tools/aapt" dump badging release/METRA-API36-QA.apk | grep -q "targetSdkVersion:'36'"
          sha256sum release/METRA-API36-QA.apk > release/METRA-API36-QA.apk.sha256

      - name: Check dedicated Play upload signing secrets (never logged)
        id: signing
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.METRA_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          PLAY_STORE_PASSWORD: ${{ secrets.METRA_PLAY_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.METRA_PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.METRA_PLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$PLAY_UPLOAD_KEYSTORE_BASE64" ] || [ -z "$PLAY_STORE_PASSWORD" ] || [ -z "$PLAY_KEY_ALIAS" ] || [ -z "$PLAY_KEY_PASSWORD" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::warning::No dedicated Google Play upload key configured. AAB blocked; QA APK only.'
            exit 0
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Sign and produce the official Google Play App Bundle
        if: steps.signing.outputs.ready == 'true'
        env:
          PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.METRA_PLAY_UPLOAD_KEYSTORE_BASE64 }}
          METRA_RELEASE_STORE_PASSWORD: ${{ secrets.METRA_PLAY_STORE_PASSWORD }}
          METRA_RELEASE_KEY_ALIAS: ${{ secrets.METRA_PLAY_KEY_ALIAS }}
          METRA_RELEASE_KEY_PASSWORD: ${{ secrets.METRA_PLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > android/app/metra-release.keystore
          chmod 600 android/app/metra-release.keystore
          actual="$(keytool -list -v -keystore android/app/metra-release.keystore -storepass "$METRA_RELEASE_STORE_PASSWORD" -alias "$METRA_RELEASE_KEY_ALIAS" | awk -F'SHA256: ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ -z "$actual" ] || [ "$actual" = 'FAC61745DC0903786FB9EDE62A962B399F7348F0BB6F899B8332667591033B9C' ]; then
            echo '::error::A dedicated non-debug Play upload signing key is required.'
            exit 1
          fi
          cd android
          ./gradlew clean bundleRelease --no-daemon --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
          cd ..
          test -s android/app/build/outputs/bundle/release/app-release.aab
          cp android/app/build/outputs/bundle/release/app-release.aab release/METRA-PlayStore.aab
          # A Google Play upload keystore is self-signed by design.
          # jarsigner -strict exits 4 for PKIX/self-signed warnings even when the
          # AAB has a valid JAR signature. Verify cryptographic integrity without
          # asking a public CA to vouch for our self-signed upload key.
          jarsigner -verify release/METRA-PlayStore.aab > "$RUNNER_TEMP/metra-aab-signature-check.txt" 2>&1
          if ! grep -q '^jar verified' "$RUNNER_TEMP/metra-aab-signature-check.txt"; then
            echo '::error::Signed AAB verification did not report jar verified.'
            exit 1
          fi
          echo 'Signed App Bundle integrity: verified (self-signed upload certificate expected).'
          jarcert="$(keytool -printcert -jarfile release/METRA-PlayStore.aab | awk -F'SHA256: ' '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$jarcert"
          sha256sum release/METRA-PlayStore.aab > release/METRA-PlayStore.aab.sha256
          rm -f android/app/metra-release.keystore

      - name: Archive Play signing QA result and test APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: METRA-Android16-QA-${{ github.run_number }}
          path: release/METRA-API36-QA.apk*
          if-no-files-found: warn
          retention-days: 30

      - name: Archive signed AAB only when a genuine upload key was supplied
        uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true' && github.ref_name != 'fix/metra-restore-recovery-release-20261124'
        with:
          name: METRA-PlayStore-AAB-${{ github.run_number }}
          path: release/METRA-PlayStore.aab*
          if-no-files-found: error
          retention-days: 30

      - name: Stage new signed AAB for native qualification (not yet approved)
        if: steps.signing.outputs.ready == 'true' && github.ref_name == 'fix/metra-restore-recovery-release-20261124'
        uses: actions/upload-artifact@v4
        with:
          name: METRA-PlayStore-AAB-UNQUALIFIED-${{ github.run_number }}
          path: release/METRA-PlayStore.aab*
          if-no-files-found: error
          retention-days: 14

  qualify-restore:
    if: github.ref_name == 'fix/metra-restore-recovery-release-20261124'
    needs: secure-android
    strategy:
      fail-fast: false
      matrix:
        scenario: [roundtrip, bulk, recovery, interface, report]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent ZIP and media verification tools
        run: |
          python -m pip install 'pyzipper==0.3.6' 'Pillow==11.3.0' 'pypdf==5.9.0'
          python -m py_compile .github/scripts/android_aab_restore_retention.py .github/scripts/android_backup_smoke.py .github/scripts/android_restore_recovery.py .github/scripts/android_legacy_bulk_restore.py .github/scripts/android_candidate_scenario.py .github/scripts/android_mobile_layout.py .github/scripts/android_report_benchmark.py
      - name: Download previous signed AAB 44
        uses: actions/download-artifact@v4
        with:
          name: METRA-PlayStore-AAB-44
          run-id: 45194050713
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: aabprevious
      - name: Download exact new signed AAB from this run
        uses: actions/download-artifact@v4
        with:
          name: METRA-PlayStore-AAB-UNQUALIFIED-${{ github.run_number }}
          path: aabnew
      - name: Verify cryptographic hashes and signatures, generate APKs from exact AABs
        run: |
          set -euo pipefail
          mkdir -p audit-results
          curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar -o "$RUNNER_TEMP/bundletool.jar"
          keytool -genkeypair -keystore "$RUNNER_TEMP/qa.p12" -storetype PKCS12 -storepass android -keypass android -alias metraqa -keyalg RSA -keysize 2048 -validity 365 -dname "CN=Disposable METRA QA"
          for n in previous new; do
            dir="aab$n"
            test "$(find "$dir" -name '*.aab' -type f | wc -l)" -eq 1
            aab="$(find "$dir" -name '*.aab' -type f)"
            expected="$(awk '{print $1}' "$(find "$dir" -name '*.aab.sha256' -type f)")"
            actual="$(sha256sum "$aab" | awk '{print $1}')"
            test "$expected" = "$actual"
            printf 'AAB %s SHA256 %s\n' "$n" "$actual" | tee -a audit-results/aab-identity.txt
            jarsigner -verify "$aab" > "audit-results/aab$n-signature.txt"
            grep -q 'jar verified' "audit-results/aab$n-signature.txt"
            java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$aab"
            java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="$aab" > "audit-results/aab$n-manifest.xml"
            java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle="$aab" --output="$dir/test.apks" --mode=universal --ks="$RUNNER_TEMP/qa.p12" --ks-pass=pass:android --ks-key-alias=metraqa --key-pass=pass:android
            unzip -p "$dir/test.apks" universal.apk > "$dir/test.apk"
            test -s "$dir/test.apk"
            sha256sum "$dir/test.apk" >> audit-results/aab-identity.txt
          done
          old_cert="$(keytool -printcert -jarfile aabprevious/METRA-PlayStore.aab | grep "SHA256:" | head -1)"
          new_cert="$(keytool -printcert -jarfile aabnew/METRA-PlayStore.aab | grep "SHA256:" | head -1)"
          test -n "$old_cert" && test "$old_cert" = "$new_cert"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          for n in previous new; do
            "$tools/apksigner" verify --verbose "aab$n/test.apk"
            "$tools/aapt" dump badging "aab$n/test.apk" > "audit-results/aab$n-apk-badging.txt"
            grep -q "package: name='com.visitetechnique.tablet'" "audit-results/aab$n-apk-badging.txt"
          done
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Native candidate test - ${{ matrix.scenario }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 .github/scripts/android_candidate_scenario.py ${{ matrix.scenario }} aabprevious/test.apk aabnew/test.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: METRA-NEW-AAB-RESTORE-${{ github.run_number }}-${{ matrix.scenario }}
          path: audit-results/
          if-no-files-found: warn
          retention-days: 14

  qualified-play-artifact:
    if: github.ref_name == 'fix/metra-restore-recovery-release-20261124'
    needs: [secure-android, qualify-restore]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download the tested signed AAB without rebuilding
        uses: actions/download-artifact@v4
        with:
          name: METRA-PlayStore-AAB-UNQUALIFIED-${{ github.run_number }}
          path: verified
      - name: Verify the exact final AAB bytes
        run: |
          set -euo pipefail
          cd verified
          expected="$(awk '{print $1}' METRA-PlayStore.aab.sha256)"
          actual="$(sha256sum METRA-PlayStore.aab | awk '{print $1}')"
          test "$expected" = "$actual"
          jarsigner -verify METRA-PlayStore.aab | grep -q 'jar verified'
          printf '%s  %s\n' "$actual" METRA-PlayStore.aab > METRA-PlayStore.aab.sha256
      - name: Archive the qualified candidate for internal Play testing
        uses: actions/upload-artifact@v4
        with:
          name: METRA-PlayStore-AAB-${{ github.run_number }}
          path: verified/METRA-PlayStore.aab*
          if-no-files-found: error
          retention-days: 30
