name: Apply empty Materials tab preservation

on:
  push:
    branches:
      - perf/metra-global-runtime-audit
    paths:
      - '.github/workflows/apply-empty-material-preservation.yml'

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: perf/metra-global-runtime-audit
          fetch-depth: 0

      - name: Preserve frozen materials when local tab is empty
        run: python3 .github/scripts/apply_empty_material_preservation.py

      - name: Validate partial upload contracts and executable tests
        run: |
          node .github/scripts/check_partial_intranet_visit_contract.js
          node --check intranetVisitPayload.js
          node --check .github/scripts/test_intranet_visit_upload.js
          node .github/scripts/test_intranet_visit_upload.js
          node .github/scripts/test_intranet_visit_upload_audit.js

      - name: Validate build-time runtime regression patch compatibility
        run: |
          python3 .github/scripts/patch_runtime_regressions.py
          node --check intranetVisitPayload.js
          node .github/scripts/check_partial_intranet_visit_contract.js

      - name: Commit patched runtime source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add intranetVisitPayload.js .github/scripts/test_intranet_visit_upload.js .github/scripts/check_partial_intranet_visit_contract.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: conserver les materiels Intranet si onglet vide"
          git push origin HEAD:perf/metra-global-runtime-audit
